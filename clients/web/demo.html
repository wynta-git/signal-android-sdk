<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAM — End-to-End Demo (20 Users)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa; --surface: #ffffff; --surface2: #f0f1f5;
      --border: #dde1ea; --accent: #4f46e5; --accent2: #7c3aed;
      --text: #1a1d2e; --text-dim: #7c84a0;
      --green: #16a34a; --green-bg: #f0fdf4;
      --red: #dc2626; --red-bg: #fef2f2;
      --blue: #2563eb; --blue-bg: #eff6ff;
      --orange: #ea580c;
      --mono: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
      --radius: 10px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .header-brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
    .header-brand .logo { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 14px; letter-spacing: -1px; }
    .header-brand h1 { font-size: 16px; font-weight: 800; color: var(--accent); letter-spacing: .5px; }
    .header-brand .subtitle { font-size: 11px; color: var(--text-dim); font-weight: 500; }
    .cfg { display: flex; flex-direction: column; gap: 2px; }
    .cfg label { font-size: 10px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .cfg input { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: var(--mono); color: var(--text); background: var(--surface2); width: 200px; outline: none; }
    .cfg input:focus { border-color: var(--accent); }
    .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .btn { padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-ghost { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: #b0b8cc; }
    .pipeline-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 0; overflow-x: auto; }
    .pipe-node { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--text-dim); background: var(--surface2); border: 1px solid var(--border); white-space: nowrap; min-width: 80px; text-align: center; transition: all .2s; }
    .pipe-node .node-icon { font-size: 16px; }
    .pipe-node.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
    .pipe-node.done { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .pipe-node.error { background: var(--red-bg); border-color: var(--red); color: var(--red); }
    .pipe-arrow { color: var(--border); font-size: 18px; padding: 0 4px; flex-shrink: 0; font-weight: 300; }
    .main { display: flex; flex: 1; gap: 0; }
    .steps-nav { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; position: sticky; top: 113px; height: calc(100vh - 113px); overflow-y: auto; }
    .steps-nav-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-dim); padding: 0 16px 8px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; font-size: 12px; color: var(--text-dim); transition: background .1s; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
    .nav-item.done { color: var(--green); }
    .nav-item.error { color: var(--red); }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--border); }
    .nav-item.active .nav-dot { background: var(--blue); }
    .nav-item.done .nav-dot { background: var(--green); }
    .nav-item.error .nav-dot { background: var(--red); }
    .nav-item.running .nav-dot { background: var(--blue); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.3); } }
    .steps-content { flex: 1; padding: 20px 24px; overflow-y: auto; max-width: 880px; }
    .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; transition: box-shadow .2s; }
    .step-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .step-card.active { border-color: var(--blue); }
    .step-card.done { border-color: var(--green); }
    .step-card.error { border-color: var(--red); }
    .step-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; background: var(--surface2); color: var(--text-dim); }
    .step-card.active .step-num { background: var(--blue-bg); color: var(--blue); }
    .step-card.done .step-num { background: var(--green-bg); color: var(--green); }
    .step-card.error .step-num { background: var(--red-bg); color: var(--red); }
    .step-card.running .step-num { background: var(--blue-bg); color: var(--blue); animation: pulse 1s infinite; }
    .step-meta { flex: 1; }
    .step-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .step-desc { font-size: 12px; color: var(--text-dim); }
    .step-status { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }
    .step-card.active .step-status, .step-card.running .step-status { background: var(--blue-bg); color: var(--blue); }
    .step-card.done .step-status { background: var(--green-bg); color: var(--green); }
    .step-card.error .step-status { background: var(--red-bg); color: var(--red); }
    .step-card:not(.active):not(.done):not(.error):not(.running) .step-status { background: var(--surface2); color: var(--text-dim); }
    .step-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
    .step-body.open { display: block; }
    .endpoint-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-family: var(--mono); color: var(--text-dim); margin: 12px 0 8px; }
    .method { font-weight: 700; }
    .method.POST { color: var(--blue); }
    .method.GET { color: var(--green); }
    .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim); margin-bottom: 4px; margin-top: 10px; }
    .code-block { background: #1e1e2e; color: #cdd6f4; border-radius: 7px; padding: 12px; font-size: 12px; font-family: var(--mono); overflow-x: auto; white-space: pre; line-height: 1.6; }
    .code-block.response-ok { border-left: 3px solid var(--green); }
    .code-block.response-err { border-left: 3px solid var(--red); }
    .multi-endpoint { display: flex; flex-direction: column; gap: 8px; }
    .endpoint-row { display: flex; align-items: center; gap: 8px; font-size: 12px; font-family: var(--mono); }
    .svc-status { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .svc-status.ok { background: var(--green); }
    .svc-status.err { background: var(--red); }
    .svc-status.checking { background: var(--blue); animation: pulse 1s infinite; }
    .verify-box { background: #1e1e2e; color: #cdd6f4; border-radius: 7px; padding: 12px; font-size: 12px; font-family: var(--mono); border-left: 3px solid var(--orange); }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .summary-cell { background: var(--surface2); border-radius: 7px; padding: 10px; text-align: center; }
    .summary-cell .val { font-size: 22px; font-weight: 800; color: var(--accent); }
    .summary-cell .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .progress-wrap { background: var(--border); border-radius: 3px; height: 4px; margin-top: 4px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width .4s ease; }
    .user-tier-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-right: 4px; }
    .tier-vip { background: #fef3c7; color: #b45309; }
    .tier-regular { background: #dbeafe; color: #1d4ed8; }
    .tier-withdrawer { background: #fce7f3; color: #9d174d; }
    .tier-new { background: #f0fdf4; color: #166534; }
    .info-box { border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.7; margin-bottom: 8px; }
    .info-box.blue { background: var(--blue-bg); border: 1px solid #bfdbfe; }
    .info-box.green { background: var(--green-bg); border: 1px solid #bbf7d0; }
    .info-box.orange { background: #fff7ed; border: 1px solid #fed7aa; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="logo">P</div>
    <div>
      <h1>PAM Platform</h1>
      <div class="subtitle">End-to-End Demo — 20 Users</div>
    </div>
  </div>
  <div class="cfg">
    <label>Host</label>
    <input id="cfgHost" value="http://3.7.48.14" placeholder="http://3.7.48.14">
  </div>
  <div class="cfg">
    <label>API Token</label>
    <input id="cfgToken" value="pam_live_-sYoMnPHlETbPgxX86jDtoZdcL8UulJa" placeholder="pam_live_...">
  </div>
  <div class="cfg">
    <label>Service Account</label>
    <input id="cfgSvcUser" value="portal-ui" style="width:130px">
  </div>
  <div class="cfg">
    <label>Password</label>
    <input id="cfgSvcPass" value="glgportal2026" type="password" style="width:130px">
  </div>

    <label>Project ID</label>
    <input id="cfgProject" value="proj_demo" style="width:90px">
  </div>
  <div class="header-actions">

      <div style="font-size:11px;color:var(--text-dim)" id="progressLabel">Ready</div>
      <div class="progress-wrap" style="width:120px">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
    </div>

    <button class="btn btn-primary" id="runBtn" onclick="runAll()">&#9654; Run Full Demo</button>

</div>

<div class="pipeline-bar">
  <div class="pipe-node" id="pipe-api"><span class="node-icon">📡</span>API Service</div>
  <div class="pipe-arrow">→</div>
  <div class="pipe-node" id="pipe-kafka"><span class="node-icon">⚡</span>Kafka</div>
  <div class="pipe-arrow">→</div>
  <div class="pipe-node" id="pipe-ch"><span class="node-icon">🗄</span>ClickHouse</div>
  <div class="pipe-arrow" style="color:transparent">→</div>
  <div class="pipe-node" id="pipe-mongo"><span class="node-icon">🍃</span>MongoDB</div>
  <div class="pipe-arrow">←</div>
  <div class="pipe-node" id="pipe-seg"><span class="node-icon">🎯</span>Segmentation</div>
  <div class="pipe-arrow">←</div>
  <div class="pipe-node" id="pipe-camp"><span class="node-icon">📣</span>Campaign</div>
  <div class="pipe-arrow">←</div>
  <div class="pipe-node" id="pipe-notif"><span class="node-icon">🔔</span>Notifications</div>
</div>

<div class="main">
  <div class="steps-nav">
    <div class="steps-nav-title">Steps</div>
    <div id="stepsNav"></div>
  </div>
  <div class="steps-content" id="stepsContent"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  portalJwt: null,
  segments: { buyers: null, hvd: null, gamers: null, withdrawers: null },
  campaigns: { purchase: null, hvd: null, reengagement: null },
  templateId: null,
  runId: Date.now().toString(36),
};

function cfg(id) { return document.getElementById(id).value.trim(); }
const host    = () => cfg('cfgHost').replace(/\/$/, '');
const token   = () => cfg('cfgToken');
const svcUser = () => cfg('cfgSvcUser');
const svcPass = () => cfg('cfgSvcPass');
const projId  = () => cfg('cfgProject');

// ── 20 demo users ──────────────────────────────────────────────────────────
function demoUsers() {
  const tiers    = ['vip','vip','vip','vip','vip','regular','regular','regular','regular','regular','withdrawer','withdrawer','withdrawer','withdrawer','withdrawer','new','new','new','new','new'];
  const plans    = ['pro','pro','pro','pro','pro','premium','premium','premium','premium','premium','free','free','free','free','free','free','free','free','free','free'];
  const levels   = [75,70,65,60,55, 35,30,28,25,22, 12,10,9,8,7, 5,4,3,2,1];
  const countries = ['IN','US','UK','AU','CA'];

  return Array.from({length: 20}, (_, i) => {
    const n        = i + 1;
    const platform = i % 2 === 0 ? 'android' : 'ios';
    return {
      id:       `demo_${state.runId}_${String(n).padStart(3,'0')}`,
      name:     `Demo User ${String(n).padStart(2,'0')}`,
      platform,
      os:       platform === 'android' ? 'android-14' : 'ios-17',
      sdk:      platform === 'android' ? { name: 'pam-android', version: '2.1.0' } : { name: 'pam-ios', version: '2.0.3' },
      tier:     tiers[i],
      plan:     plans[i],
      level:    levels[i],
      country:  countries[i % 5],
    };
  });
}

// ── Event factory ──────────────────────────────────────────────────────────
function makeEvent(eventName, u, properties, offsetSecs = 0) {
  return {
    event_id:       newUUID(),
    event_name:     eventName,
    user_id:        u.id,
    timestamp:      ts(offsetSecs),
    sdk:            u.sdk,
    device:         { platform: u.platform, os: u.os },
    properties,
    schema_version: 1,
  };
}

// ── HTTP helper ────────────────────────────────────────────────────────────
async function api(method, url, body, headers = {}) {
  const opts = { method, headers: { 'Content-Type': 'application/json', ...headers } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  let data;
  try { data = await r.json(); } catch { data = null; }
  return { status: r.status, ok: r.ok, data };
}

// ── Step 1 — Health ────────────────────────────────────────────────────────
async function stepHealth(card) {
  const services = [
    { name: 'api-service',     url: `${host()}:8001/api/v1/events/health` },
    { name: 'auth-service',    url: `${host()}:8002/api/v1/system/health` },
    { name: 'segmentation',    url: `${host()}:8003/health` },
    { name: 'campaign-engine', url: `${host()}:8004/health` },
    { name: 'notifications',   url: `${host()}:8005/health` },
  ];
  const rows = card.querySelector('.multi-endpoint');
  rows.innerHTML = services.map(s => `
    <div class="endpoint-row" id="hrow-${s.name}">
      <div class="svc-status checking" id="hst-${s.name}"></div>
      <span style="color:var(--text-dim);width:160px">${s.name}</span>
      <span style="font-size:11px;color:var(--text-dim)">${s.url}</span>
    </div>`).join('');
  let allOk = true;
  for (const svc of services) {
    const dot = document.getElementById(`hst-${svc.name}`);
    try {
      const r = await fetch(svc.url, { signal: AbortSignal.timeout(4000) });
      dot.className = r.ok ? 'svc-status ok' : 'svc-status err';
      if (!r.ok) allOk = false;
    } catch { dot.className = 'svc-status err'; allOk = false; }
  }
  if (!allOk) throw new Error('One or more services are unreachable');
  return 'All 5 services healthy';
}

// ── Step 2 — JWT ───────────────────────────────────────────────────────────
async function stepGetJwt(card) {
  showRequest(card, 'POST', `${host()}:8002/api/v1/system/portal_token`,
    { username: svcUser(), password: '***', project_id: projId() });
  const r = await api('POST', `${host()}:8002/api/v1/system/portal_token`,
    { username: svcUser(), password: svcPass(), project_id: projId() });
  showResponse(card, r);
  if (!r.ok) throw new Error(r.data?.detail || 'Auth failed');
  state.portalJwt = r.data?.data?.token;
  if (!state.portalJwt) throw new Error('No token in response');
  return 'Portal JWT obtained';
}

// ── Step 3 — App Events (all 20) ────────────────────────────────────────────
async function stepAppEvents(card) {
  const users = demoUsers();
  const events = [];
  users.forEach((u, i) => {
    events.push(makeEvent('app_opened',    u, { from_background: i % 3 === 0 }, i * 2 + 120));
    events.push(makeEvent('login',         u, { method: i % 2 === 0 ? 'email' : 'google', session_id: newUUID() }, i * 2 + 60));
    events.push(makeEvent('screen_viewed', u, { screen_name: ['home','lobby','wallet','promotions'][i % 4], referrer: 'direct' }, i * 2));
  });
  showRequest(card, 'POST', `${host()}:8001/api/v1/events/track`,
    { events: [`${events.length} events — app_opened, login, screen_viewed × 20 users`] });
  const r = await api('POST', `${host()}:8001/api/v1/events/track`, { events },
    { Authorization: `Bearer ${token()}` });
  showResponse(card, r);
  if (!r.ok) throw new Error('App events failed');
  return `${r.data.accepted} accepted → 20 users × 3 events (app_opened, login, screen_viewed)`;
}

// ── Step 4 — Purchase Events (users 1–10) ──────────────────────────────────
async function stepPurchaseEvents(card) {
  const users  = demoUsers();
  const events = [];
  const amounts = [3999, 2999, 1999, 1499, 999, 899, 799, 699, 599, 499];

  // VIP (1-5): 2 purchases each
  users.slice(0, 5).forEach((u, i) => {
    events.push(makeEvent('purchase_completed', u, {
      order_id: `ORD-VIP-${state.runId}-${i}-A`,
      amount: amounts[i], currency: 'INR',
      items: [{ sku: `COIN-${amounts[i]}`, qty: 1, price: amounts[i] }],
    }, 180 + i * 5));
    events.push(makeEvent('purchase_completed', u, {
      order_id: `ORD-VIP-${state.runId}-${i}-B`,
      amount: Math.round(amounts[i] / 2), currency: 'INR',
      items: [{ sku: `COIN-${Math.round(amounts[i]/2)}`, qty: 1, price: Math.round(amounts[i]/2) }],
    }, 90 + i * 5));
  });

  // Regular (6-10): 1 purchase each
  users.slice(5, 10).forEach((u, i) => {
    events.push(makeEvent('purchase_completed', u, {
      order_id: `ORD-REG-${state.runId}-${i}`,
      amount: amounts[5 + i], currency: 'INR',
      items: [{ sku: `COIN-${amounts[5+i]}`, qty: 1, price: amounts[5+i] }],
    }, 120 + i * 5));
  });

  card.querySelector('.step-body').insertAdjacentHTML('beforeend', `
    <div class="info-box blue" style="margin-top:10px">
      <strong>VIP users (1–5):</strong> 2 purchases each — qualifies for Buyers segment<br>
      <strong>Regular users (6–10):</strong> 1 purchase each — also qualifies for Buyers segment<br>
      <strong>Withdrawers &amp; New (11–20):</strong> no purchases — will NOT be in Buyers segment
    </div>`);

  showRequest(card, 'POST', `${host()}:8001/api/v1/events/track`,
    { events: [`${events.length} purchase_completed events for users 1–10`] });
  const r = await api('POST', `${host()}:8001/api/v1/events/track`, { events },
    { Authorization: `Bearer ${token()}` });
  showResponse(card, r);
  if (!r.ok) throw new Error('Purchase events failed');
  return `${r.data.accepted} accepted — VIP: 2 purchases ea, Regular: 1 purchase ea`;
}

// ── Step 5 — Deposit Events ────────────────────────────────────────────────
async function stepDepositEvents(card) {
  const users  = demoUsers();
  const events = [];

  // VIP (1-5): 3 deposits each → qualifies for HVD segment
  users.slice(0, 5).forEach((u, i) => {
    [2500 + i*200, 1800 + i*150, 3200 + i*300].forEach((amount, d) => {
      events.push(makeEvent('deposit_success', u, {
        amount, currency: 'INR',
        transaction_id: `DEP-VIP-${state.runId}-${i}-${d}`,
        method: ['upi','card','netbanking'][d],
      }, (i * 3 + d) * 15));
    });
  });

  // Regular (6-10): 1 deposit each
  users.slice(5, 10).forEach((u, i) => {
    events.push(makeEvent('deposit_success', u, {
      amount: 600 + i * 100, currency: 'INR',
      transaction_id: `DEP-REG-${state.runId}-${i}`,
      method: 'upi',
    }, i * 20));
  });

  // Withdrawers (11-15): 1 deposit each (before they withdraw)
  users.slice(10, 15).forEach((u, i) => {
    events.push(makeEvent('deposit_success', u, {
      amount: 200 + i * 50, currency: 'INR',
      transaction_id: `DEP-WD-${state.runId}-${i}`,
      method: 'upi',
    }, i * 25 + 200));
  });

  card.querySelector('.step-body').insertAdjacentHTML('beforeend', `
    <div class="info-box blue" style="margin-top:10px">
      <strong>VIP (1–5):</strong> 3 deposits each (₹1,800–₹4,700) — 3+ threshold for HVD segment<br>
      <strong>Regular (6–10):</strong> 1 deposit each — below HVD threshold<br>
      <strong>Withdrawers (11–15):</strong> 1 deposit each (they will later withdraw)
    </div>`);

  showRequest(card, 'POST', `${host()}:8001/api/v1/events/track`,
    { events: [`${events.length} deposit_success events`] });
  const r = await api('POST', `${host()}:8001/api/v1/events/track`, { events },

// ── Step 7 — Game Events ────────────────────────────────────────────────────
async function stepGameEvents(card) {
  const users  = demoUsers();
  const games  = ['slots','roulette','blackjack','poker','crash'];
  const events = [];

  // VIP (1-5): 5 game_played + 1 level_up each
  users.slice(0, 5).forEach((u, i) => {
    for (let g = 0; g < 5; g++) {
      events.push(makeEvent('game_played', u, {
        game_id: games[g % games.length],
        bet_amount: 100 + g * 50,
        result: g % 2 === 0 ? 'win' : 'loss',
        profit: g % 2 === 0 ? 200 + g * 30 : -(50 + g * 20),
        session_id: newUUID(),
      }, (i * 5 + g) * 8));
    }
    events.push(makeEvent('level_up', u, {
      from_level: levels[i] - 1, to_level: levels[i], xp_earned: 1500,
    }, i * 20));
  });

  // Regular (6-10): 3 game_played each → qualifies for Gamers segment
  users.slice(5, 10).forEach((u, i) => {
    for (let g = 0; g < 3; g++) {
      events.push(makeEvent('game_played', u, {
        game_id: games[(i + g) % games.length],
        bet_amount: 50 + g * 25,
        result: g === 0 ? 'win' : 'loss',
        profit: g === 0 ? 100 : -40,
        session_id: newUUID(),
      }, (i * 3 + g) * 12));
    }
    if (i % 2 === 0) {
      events.push(makeEvent('level_up', u, {
        from_level: 19 + i * 2, to_level: 20 + i * 2, xp_earned: 600,
      }, i * 30));
    }
  });

  // Withdrawers (11-15): 2 game_played — NOT enough for Gamers segment
  users.slice(10, 15).forEach((u, i) => {
    for (let g = 0; g < 2; g++) {
      events.push(makeEvent('game_played', u, {
        game_id: games[(i + g) % games.length],
        bet_amount: 25, result: 'loss', profit: -25,
        session_id: newUUID(),
      }, (i * 2 + g) * 18));
    }
  });

  card.querySelector('.step-body').insertAdjacentHTML('beforeend', `
    <div class="info-box blue" style="margin-top:10px">
      <strong>VIP (1–5):</strong> 5 games + level_up — qualifies for Gamers segment (≥3)<br>
      <strong>Regular (6–10):</strong> 3 games — exactly meets Gamers threshold<br>
      <strong>Withdrawers (11–15):</strong> 2 games only — below threshold, NOT in Gamers segment
    </div>`);

  showRequest(card, 'POST', `${host()}:8001/api/v1/events/track`,
    { events: [`${events.length} game events (game_played, level_up)`] });
  const r = await api('POST', `${host()}:8001/api/v1/events/track`, { events },
    { Authorization: `Bearer ${token()}` });
  showResponse(card, r);
  if (!r.ok) throw new Error('Game events failed');
  return `${r.data.accepted} accepted — VIP: 5 games+lvlup, Regular: 3 games, Withdrawers: 2 games → ClickHouse`;
}

// ── Step 9 — Identify Users ─────────────────────────────────────────────────
async function stepIdentify(card) {
  const users = demoUsers();

  showRequest(card, 'POST', `${host()}:8001/api/v1/events/identify`, {
    user_id: users[0].id,
    traits: { name: users[0].name, plan: users[0].plan, country: users[0].country, level: users[0].level, tier: users[0].tier },
    timestamp: new Date().toISOString(),
    '...': `+ ${users.length - 1} more identify calls`,
  });

  let success = 0, failed = 0, lastR = null;
  for (const u of users) {
    const r = await api('POST', `${host()}:8001/api/v1/events/identify`, {
      user_id: u.id,
      traits: { name: u.name, plan: u.plan, country: u.country, level: u.level, tier: u.tier },
      timestamp: new Date().toISOString(),
    }, { Authorization: `Bearer ${token()}` });
    if (r.ok) success++; else failed++;
    lastR = r;
    const statusEl = document.getElementById(`card-identify`)?.querySelector('.step-status');
    if (statusEl) statusEl.textContent = `${success}/20 identified…`;
  }

  if (lastR) showResponse(card, lastR);
  if (failed > 0) throw new Error(`${failed}/${users.length} identify calls failed`);
  return `${success}/20 profiles upserted → MongoDB  (VIP×5 pro, Regular×5 premium, Withdrawers×5 free, New×5 free)`;
}

// ── Step 14 — Evaluate All Segments ────────────────────────────────────────
async function stepEvaluateAll(card) {
  const segEntries = Object.entries(state.segments).filter(([, v]) => v);
  if (segEntries.length === 0) throw new Error('No segments created');

  card.querySelector('.step-body').insertAdjacentHTML('beforeend', `
    <div class="section-label" style="margin-top:12px">Running ${segEntries.length} evaluations in parallel</div>`);

  const results = await Promise.all(
    segEntries.map(([key, segId]) =>
      api('POST', `${host()}:8003/api/v1/segment/segments/${segId}/evaluate`,
          null, { Authorization: `Bearer ${state.portalJwt}` })
        .then(r => ({ key, segId, size: r.data?.size ?? '?', ok: r.ok, data: r.data }))
    )
  );

  // Show sizes
  const grid = `<div class="summary-grid" style="grid-template-columns:repeat(4,1fr);margin-top:8px">
    ${results.map(r => `<div class="summary-cell">
      <div class="val" style="color:${r.ok ? 'var(--accent)' : 'var(--red)'}">${r.ok ? r.size : '✗'}</div>
      <div class="lbl">${r.key}</div>
    </div>`).join('')}
  </div>`;
  card.querySelector('.step-body').insertAdjacentHTML('beforeend', grid);

  const failed = results.filter(r => !r.ok);
  if (failed.length > 0) throw new Error(`${failed.length} evaluations failed`);
  return results.map(r => `${r.key}: ${r.size}`).join(' · ');
}

// ── Step 15 — Check Memberships ─────────────────────────────────────────────
async function stepMemberships(card) {
  const users = demoUsers();
  const checks = [
    { user: users[0],  seg: 'buyers',     label: 'u01→buyers',  expect: true  },
    { user: users[0],  seg: 'hvd',        label: 'u01→hvd',     expect: true  },
    { user: users[0],  seg: 'gamers',     label: 'u01→gamers',  expect: true  },
    { user: users[5],  seg: 'buyers',     label: 'u06→buyers',  expect: true  },
    { user: users[5],  seg: 'hvd',        label: 'u06→hvd',     expect: false },
    { user: users[10], seg: 'withdrawers',label: 'u11→wd',      expect: true  },
    { user: users[10], seg: 'buyers',     label: 'u11→buyers',  expect: false },
    { user: users[19], seg: 'gamers',     label: 'u20→gamers',  expect: false },
  ].filter(c => state.segments[c.seg]);

  const results = await Promise.all(
    checks.map(c =>
      api('GET',
        `${host()}:8003/api/v1/segment/segments/${state.segments[c.seg]}/members/${c.user.id}`,
        null, { Authorization: `Bearer ${state.portalJwt}` })
        .then(r => ({ ...c, is_member: r.data?.is_member, ok: r.ok }))
    )
  );

  const grid = `<div class="summary-grid" style="grid-template-columns:repeat(4,1fr);margin-top:8px">
    ${results.map(r => `<div class="summary-cell">
      <div class="val" style="font-size:13px;color:${r.is_member ? 'var(--green)' : 'var(--text-dim)'}">${r.is_member ? '✓ In' : '✗ Out'}</div>
      <div class="lbl" style="font-size:10px">${r.label}</div>
    </div>`).join('')}
  </div>`;
  card.querySelector('.step-body').insertAdjacentHTML('beforeend', grid);

  const correct = results.filter(r => r.is_member === r.expect).length;
  return `${correct}/${results.length} membership checks matched expected outcomes`;
}

// ── Step 22 — Notification Engagement (all 20) ─────────────────────────────
async function stepEngagement(card) {
  const users      = demoUsers();
  const campaignId = state.campaigns.purchase || 'demo';
  const events     = [];

  // VIP (1-5): 100% open rate + 100% CTR
  users.slice(0, 5).forEach(u => {
    events.push(makeEvent('notification_opened',  u, { channel: 'push', campaign_id: campaignId }, 0));
    events.push(makeEvent('notification_clicked', u, { channel: 'push', campaign_id: campaignId, action: 'view_offer' }, 0));
  });

  // Regular (6-10): 100% open, 80% click
  users.slice(5, 10).forEach((u, i) => {
    events.push(makeEvent('notification_opened', u, { channel: 'push', campaign_id: campaignId }, 0));
    if (i < 4) events.push(makeEvent('notification_clicked', u, { channel: 'push', campaign_id: campaignId }, 0));
  });

  // Withdrawers (11-15): 60% open, no click
  users.slice(10, 15).forEach((u, i) => {
    if (i < 3) events.push(makeEvent('notification_opened', u, { channel: 'push', campaign_id: campaignId }, 0));
  });

  // New (16-20): 20% open, no click
  users.slice(15, 20).forEach((u, i) => {
    if (i === 0) events.push(makeEvent('notification_opened', u, { channel: 'push', campaign_id: campaignId }, 0));
  });

  const opens  = events.filter(e => e.event_name === 'notification_opened').length;
  const clicks = events.filter(e => e.event_name === 'notification_clicked').length;
  const openRate = Math.round((opens  / 20)    * 100);
  const ctr      = Math.round((clicks / opens) * 100);

  showRequest(card, 'POST', `${host()}:8001/api/v1/events/track`,
    { events: [`${events.length} engagement events across all 20 users`] });
  const r = await api('POST', `${host()}:8001/api/v1/events/track`, { events },
    { Authorization: `Bearer ${token()}` });
  showResponse(card, r);
  if (!r.ok) throw new Error('Engagement events failed');

  card.querySelector('.step-body').insertAdjacentHTML('beforeend', `
    <div class="summary-grid" style="margin-top:10px">
      <div class="summary-cell"><div class="val">${opens}</div><div class="lbl">Opens</div></div>
      <div class="summary-cell"><div class="val">${clicks}</div><div class="lbl">Clicks</div></div>
      <div class="summary-cell"><div class="val">${openRate}%</div><div class="lbl">Open Rate</div></div>
      <div class="summary-cell"><div class="val">${ctr}%</div><div class="lbl">CTR</div></div>
    </div>
    <div class="info-box green" style="margin-top:10px;font-size:12px">
      <strong>VIP (1–5):</strong> 100% open + 100% CTR &nbsp;|&nbsp;
      <strong>Regular (6–10):</strong> 100% open + 80% CTR &nbsp;|&nbsp;
      <strong>Withdrawers (11–15):</strong> 60% open + 0% CTR &nbsp;|&nbsp;
      <strong>New (16–20):</strong> 20% open + 0% CTR
    </div>`);

  return `${r.data.accepted} accepted — ${opens} opens (${openRate}% rate), ${clicks} clicks (${ctr}% CTR) → ClickHouse`;
}

// ── Step 23 — Post-Engagement Deposits (Attribution) ─────────────────────────
async function stepPostEngagementDeposits(card) {
  const users = demoUsers();
  const events = [];

  // VIP (1-5) all clicked → deposit now (within 24h attribution window)
  const vipAmounts = [1500, 1800, 2100, 2400, 2700];
  users.slice(0, 5).forEach((u, i) => {
    events.push(makeEvent('deposit_success', u, {
      amount: vipAmounts[i], currency: 'INR',
      transaction_id: `DEP-ATTR-VIP-${state.runId}-${i}`,
      method: ['upi','card','netbanking','upi','card'][i],
    }, 0));
  });

  // Regular (6-9) clicked → deposit now
  const regAmounts = [500, 600, 700, 800];
  users.slice(5, 9).forEach((u, i) => {
    events.push(makeEvent('deposit_success', u, {
      amount: regAmounts[i], currency: 'INR',
      transaction_id: `DEP-ATTR-REG-${state.runId}-${i}`,
      method: 'upi',
    }, 0));
  });

  const totalRev = [...vipAmounts, ...regAmounts].reduce((a, b) => a + b, 0);

  card.querySelector('.step-body').insertAdjacentHTML('beforeend', `
    <div class="info-box green" style="margin-top:10px">
      These deposits fire <strong>after</strong> the notification_clicked events in step 22,
      so they fall inside the 24 h attribution window and will be counted as conversions.
      <br><strong>VIP (1–5):</strong> ₹1,500–₹2,700 &nbsp;|&nbsp;
      <strong>Regular (6–9):</strong> ₹500–₹800
    </div>`);

  showRequest(card, 'POST', `${host()}:8001/api/v1/events/track`,
    { events: [`${events.length} deposit_success events (post-engagement)`] });
  const r = await api('POST', `${host()}:8001/api/v1/events/track`, { events },
    { Authorization: `Bearer ${token()}` });
  showResponse(card, r);
  if (!r.ok) throw new Error('Post-engagement deposits failed');
  return `${r.data.accepted} accepted — 9 users × deposit (₹${totalRev.toLocaleString('en-IN')} total) → attribution window`;
}

function showRequest(card, method, url, body) {
  const be = card.querySelector('.step-body');
  be.querySelector('.req-block')?.remove();
  const el = document.createElement('div');
  el.className = 'req-block';
  el.innerHTML = `
    <div class="endpoint-badge">
      <span class="method ${method}">${method}</span><span>${url}</span>
    </div>
    ${body ? `<div class="section-label">Request</div>
    <div class="code-block">${JSON.stringify(body, null, 2)}</div>` : ''}`;
  be.appendChild(el);
}

function showResponse(card, r) {
  const be = card.querySelector('.step-body');
  be.querySelector('.resp-block')?.remove();
  const el = document.createElement('div');
  el.className = 'resp-block';
  el.innerHTML = `
    <div class="section-label">Response <span style="color:${r.ok ? 'var(--green)' : 'var(--red)'}">HTTP ${r.status}</span></div>
    <div class="code-block ${r.ok ? 'response-ok' : 'response-err'}">${JSON.stringify(r.data, null, 2)}</div>`;
  be.appendChild(el);
}

function newUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function ts(offsetSecs) {
  return new Date(Date.now() - offsetSecs * 1000).toISOString();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Step state management ─────────────────────────────────────────────────────
const stepStates = {};

function setStepState(id, st, msg = '') {
  stepStates[id] = st;
  const card = document.getElementById(`card-${id}`);
  const nav  = document.getElementById(`nav-${id}`);
  card.className = `step-card ${st}`;
  nav.className  = `nav-item ${st}`;
  const statusEl = card.querySelector('.step-status');
  const icons = { idle: 'Idle', running: '⏳ Running…', done: '✓ Done', error: '✗ Failed', active: 'Next' };
  statusEl.textContent = (st === 'done' && msg) ? msg : icons[st];
  updateProgress();
  updatePipeline();
}

function expandCard(id) {
  document.getElementById(`body-${id}`)?.classList.add('open');
  document.getElementById(`card-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function updateProgress() {
  const done = Object.values(stepStates).filter(s => s === 'done').length;
  const pct  = Math.round((done / STEPS.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent =
    pct === 100 ? '✓ Demo complete' : `${done} / ${STEPS.length} steps`;
}

function updatePipeline() {
  const nodeMap = {};
  STEPS.forEach(s => {
    const st = stepStates[s.id] || 'idle';
    s.pipeNodes?.forEach(n => {
      if (!nodeMap[n] || st === 'running') nodeMap[n] = st;
      else if (st === 'done'  && nodeMap[n] !== 'running') nodeMap[n] = 'done';
      else if (st === 'error' && nodeMap[n] !== 'running' && nodeMap[n] !== 'done') nodeMap[n] = 'error';
    });
  });
  Object.entries(nodeMap).forEach(([id, st]) => {
    const el = document.getElementById(id);
    if (el) el.className = `pipe-node ${st === 'idle' ? '' : st === 'running' ? 'active' : st}`;
  });
}

// ── Render ─────────────────────────────────────────────────────────────────────
function renderUI() {
  const nav     = document.getElementById('stepsNav');
  const content = document.getElementById('stepsContent');
  nav.innerHTML = content.innerHTML = '';

  STEPS.forEach((step, i) => {
    stepStates[step.id] = 'idle';

    const ni = document.createElement('div');
    ni.className = 'nav-item';
    ni.id = `nav-${step.id}`;
    ni.innerHTML = `<div class="nav-dot"></div><span>${i + 1}. ${step.title}</span>`;
    ni.onclick = () => expandCard(step.id);
    nav.appendChild(ni);

    const extra = step.id === 'health' ? '<div class="multi-endpoint"></div>' : '';
    const card  = document.createElement('div');
    card.className = 'step-card';
    card.id = `card-${step.id}`;
    card.innerHTML = `
      <div class="step-header" onclick="toggleCard('${step.id}')">
        <div class="step-num">${i + 1}</div>
        <div class="step-meta">
          <div class="step-title">${step.title}</div>
          <div class="step-desc">${step.desc}</div>
        </div>
        <div class="step-status">Idle</div>
      </div>
      <div class="step-body" id="body-${step.id}">${extra}</div>`;
    content.appendChild(card);
  });
}

function toggleCard(id) {
  document.getElementById(`body-${id}`)?.classList.toggle('open');
}

// ── Run ────────────────────────────────────────────────────────────────────────
let running = false;

async function runAll() {
  if (running) return;
  running = true;
  document.getElementById('runBtn').disabled = true;

  for (const step of STEPS) {
    setStepState(step.id, 'running');
    expandCard(step.id);
    const card = document.getElementById(`card-${step.id}`);
    try {
      const msg = await step.run(card);
      setStepState(step.id, 'done', msg || 'Done');
    } catch (err) {
      setStepState(step.id, 'error', err.message || 'Error');
      card.querySelector('.step-body').classList.add('open');
      card.querySelector('.step-body').insertAdjacentHTML('beforeend',
        `<div class="code-block response-err">${err.message}</div>`);
      break;
    }
    await sleep(200);
  }

  running = false;
  document.getElementById('runBtn').disabled = false;
}

function resetDemo() {
  if (running) return;
  state.portalJwt  = null;
  state.segments   = { buyers: null, hvd: null, gamers: null, withdrawers: null };
  state.campaigns  = { purchase: null, hvd: null, reengagement: null };
  state.templateId = null;
  state.runId      = Date.now().toString(36);
  renderUI();
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressLabel').textContent = 'Ready';
  document.querySelectorAll('.pipe-node').forEach(n => n.className = 'pipe-node');
}

// ── Boot ───────────────────────────────────────────────────────────────────────
renderUI();
</script>
</body>
