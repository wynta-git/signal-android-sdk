<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAM — Segment Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface2: #f0f1f5;
      --border: #dde1ea;
      --accent: #4f46e5;
      --text: #1a1d2e;
      --text-dim: #7c84a0;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
      --blue: #2563eb;
      --purple: #7c3aed;
      --mono: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Config bar ── */
    .config-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .config-bar h1 {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      padding-bottom: 6px;
      margin-right: 4px;
      white-space: nowrap;
    }

    .config-bar h1 span {
      color: var(--text-dim);
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0;
    }

    .cfg-field { display: flex; flex-direction: column; gap: 4px; }

    .cfg-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .cfg-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-family: var(--mono);
      transition: border-color 0.15s;
    }

    .cfg-input:focus { outline: none; border-color: var(--accent); }
    .cfg-input.wide  { width: 260px; }
    .cfg-input.med   { width: 180px; }
    .cfg-input.small { width: 140px; }

    /* ── Main layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
      gap: 0;
    }

    /* ── Builder pane ── */
    .builder {
      width: 52%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
      min-height: 0;
    }

    .builder-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 16px;
    }

    .builder-scroll .card {
      margin-bottom: 14px;
    }

    .builder-scroll .card:last-child {
      margin-bottom: 0;
    }

    /* ── Section cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .card-head {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Form rows ── */
    .form-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-row label {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      min-width: 90px;
    }

    .field {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .field:focus { outline: none; border-color: var(--accent); }
    .field.grow { flex: 1; min-width: 120px; }
    .field.small { width: 80px; }
    .field.med { width: 140px; }

    select.field { cursor: pointer; }

    /* ── Match toggle ── */
    .match-toggle { display: flex; gap: 6px; }

    .match-btn {
      padding: 5px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s;
      font-family: inherit;
    }

    .match-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Filter cards ── */
    .filter-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .filter-head {
      padding: 8px 12px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .filter-type-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      font-family: var(--mono);
    }

    .type-event    { background: #dbeafe; color: var(--blue); }
    .type-trait    { background: #ede9fe; color: var(--purple); }
    .type-did-not  { background: #ffedd5; color: var(--orange); }
    .type-segment  { background: #dcfce7; color: var(--green); }

    .filter-num {
      font-size: 10px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .filter-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    /* ── Where conditions (property filters inside an event filter) ── */
    .where-section {
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }

    .where-head {
      background: var(--surface2);
      padding: 5px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .where-rows { padding: 8px; display: flex; flex-direction: column; gap: 6px; }

    .where-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Buttons ── */
    .btn {
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }

    .btn-ghost {
      background: none;
      color: var(--text-dim);
    }

    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    .btn-danger {
      background: none;
      border-color: transparent;
      color: #5c3030;
      font-size: 14px;
      padding: 3px 8px;
    }

    .btn-danger:hover { color: var(--red); }

    .btn-add {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--blue);
    }

    .btn-add:hover { border-color: var(--blue); }

    .add-filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── Send bar ── */
    .send-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }

    .send-btn:hover:not(:disabled) { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--mono);
    }

    .s2xx { background: #dcfce7; color: var(--green); }
    .s4xx { background: #fee2e2; color: var(--red); }
    .s5xx { background: #ffedd5; color: var(--orange); }
    .elapsed { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }

    /* ── Preview pane ── */
    .preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .preview-head {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--surface);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .preview-section {
      padding: 14px;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0;
    }

    .preview-label {
      padding: 7px 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--surface);
      flex-shrink: 0;
    }

    .response-section {
      padding: 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 100px;
      flex-shrink: 0;
    }

    /* ── JSON highlight ── */
    .jk { color: #1a1d2e; }
    .js { color: #b45309; }
    .jn { color: #16a34a; }
    .jb { color: #7c3aed; }
    .jl { color: #7c3aed; }

    /* ── Misc ── */
    .text-dim { color: var(--text-dim); font-size: 12px; }
    .validation-err {
      font-size: 11px;
      color: var(--red);
      font-family: var(--mono);
      padding: 6px 10px;
      background: #fee2e2;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Config bar -->
  <div class="config-bar">
    <h1>PAM <span>/ Segment Builder</span></h1>

    <div class="cfg-field">
      <span class="cfg-label">Auth Service URL</span>
      <input class="cfg-input med" id="cfg-auth-url" value="http://localhost:8002"
             oninput="saveConfig()">
    </div>

    <div class="cfg-field">
      <span class="cfg-label">Segmentation Engine URL</span>
      <input class="cfg-input med" id="cfg-url" value="http://localhost:8003"
             oninput="saveConfig(); meta.events=[]; meta.props={}; meta.traits=[]; fetchEventNames(); fetchTraits()">
    </div>

    <div class="cfg-field">
      <span class="cfg-label">Project ID</span>
      <input class="cfg-input small" id="cfg-project" value="proj_demo"
             oninput="saveConfig(); meta.events=[]; meta.props={}; meta.traits=[]; fetchEventNames(); fetchTraits()">
    </div>

    <div class="cfg-field" style="justify-content:flex-end">
      <span class="cfg-label">Auth</span>
      <div style="display:flex; align-items:center; gap:6px; padding-bottom:4px">
        <span id="auth-dot" style="width:8px; height:8px; border-radius:50%; background:var(--orange); display:inline-block; flex-shrink:0" title="Authenticating…"></span>
        <span id="auth-label" style="font-size:11px; color:var(--text-dim); font-family:var(--mono)">authenticating…</span>
        <button onclick="reauth()" style="font-size:11px; padding:1px 7px; border:1px solid var(--border); border-radius:4px; background:none; cursor:pointer; color:var(--text-dim)">↻</button>
      </div>
    </div>
  </div>

  <div class="main">

    <!-- Builder pane -->
    <div class="builder">
      <div class="builder-scroll">

        <!-- Segment metadata -->
        <div class="card">
          <div class="card-head">Segment Metadata</div>
          <div class="card-body">
            <div class="form-row">
              <label>Segment ID</label>
              <input class="field grow" id="seg-id" placeholder="seg_active_buyers"
                     oninput="renderPreview()">
            </div>
            <div class="form-row">
              <label>Name</label>
              <input class="field grow" id="seg-name" placeholder="Active buyers (30d)"
                     oninput="renderPreview()">
            </div>
            <div class="form-row">
              <label>Refresh</label>
              <select class="field med" id="seg-refresh" onchange="onRefreshChange()">
                <option value="on_event">on_event (real-time)</option>
                <option value="scheduled">scheduled (cron)</option>
              </select>
              <input class="field grow" id="seg-cron" placeholder="0 */6 * * *"
                     style="display:none" oninput="renderPreview()">
            </div>
          </div>
        </div>

        <!-- Match mode + filters -->
        <div class="card">
          <div class="card-head">
            <span>Filters</span>
            <div class="match-toggle">
              <span class="text-dim" style="padding-right:4px; line-height:26px">Match:</span>
              <button class="match-btn active" id="match-all" onclick="setMatch('all')">ALL</button>
              <button class="match-btn" id="match-any" onclick="setMatch('any')">ANY</button>
            </div>
          </div>
          <div class="card-body">

            <div id="filters-container">
              <!-- filter cards injected here -->
            </div>

            <div id="validation-err" class="validation-err" style="display:none"></div>

            <!-- Add filter buttons -->
            <div class="add-filter-row">
              <button class="btn btn-add" onclick="addFilter('event')">+ Event filter</button>
              <button class="btn btn-add" onclick="addFilter('trait')">+ Trait filter</button>
              <button class="btn btn-add" onclick="addFilter('did_not_do')">+ Did NOT do</button>
              <button class="btn btn-add" onclick="addFilter('in_segment')">+ In segment</button>
            </div>

          </div>
        </div>

      </div>

      <!-- Send bar -->
      <div class="send-bar">
        <button class="send-btn" id="send-btn" onclick="createSegment()">Create Segment</button>
        <span id="res-meta"></span>
        <span class="elapsed" id="res-elapsed"></span>
      </div>
    </div>

    <!-- Preview pane -->
    <div class="preview">
      <div class="preview-head">
        <span>DSL Preview — POST /segments</span>
        <span class="text-dim" id="filter-count">0 filters</span>
      </div>
      <div class="preview-scroll">
        <div class="preview-section" id="dsl-preview">
          <span style="color:var(--text-dim)">Add filters to see the DSL.</span>
        </div>
        <hr class="divider">
        <div class="preview-label">Response</div>
        <div class="response-section" id="res-body">
          <span style="color:var(--text-dim)">Hit Create Segment to see the response.</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ── State ────────────────────────────────────────────────
    let matchMode = 'all';
    let filters   = [];   // array of filter objects {id, type, ...}
    let nextId    = 1;

    const OPERATORS = ['eq', 'neq', 'gt', 'gte', 'lt', 'lte', 'in', 'not_in', 'contains', 'starts_with', 'exists'];
    const TRAIT_OPS = ['eq', 'neq', 'gt', 'gte', 'lt', 'lte', 'contains', 'starts_with', 'exists'];

    // ── Meta cache (event names + per-event properties from API) ─
    const meta = {
      events:        [],
      props:         {},
      traits:        [],
      loadingEvents:  false,
      loadingProps:   new Set(),
      loadingTraits:  false,
    };

    function baseUrl()    { return document.getElementById('cfg-url').value.replace(/\/$/, ''); }
    function projectId()  { return document.getElementById('cfg-project').value.trim(); }
    function authUrl()    { return document.getElementById('cfg-auth-url').value.replace(/\/$/, ''); }

    // ── Auth ─────────────────────────────────────────────────
    let authToken = null;

    function authHeaders() {
      return authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
    }

    function setAuthStatus(state, msg) {
      const dot = document.getElementById('auth-dot');
      const lbl = document.getElementById('auth-label');
      if (!dot) return;
      if (state === 'ok') {
        dot.style.background = 'var(--green)'; dot.title = 'Authenticated';
        lbl.textContent = 'authenticated'; lbl.style.color = 'var(--green)';
      } else if (state === 'error') {
        dot.style.background = 'var(--red)'; dot.title = msg || 'Auth failed';
        lbl.textContent = 'auth failed'; lbl.style.color = 'var(--red)';
      } else {
        dot.style.background = 'var(--orange)'; dot.title = 'Authenticating…';
        lbl.textContent = 'authenticating…'; lbl.style.color = 'var(--text-dim)';
      }
    }

    async function getPortalToken() {
      setAuthStatus('loading');
      try {
        const res = await fetch(`${authUrl()}/api/v1/system/portal_token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'portal-ui', password: 'glgportal2026', project_id: 'proj_demo' }),
        });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const data = await res.json();
        authToken = data?.data?.token;
        if (!authToken) throw new Error('No token in response');
        setAuthStatus('ok');
      } catch (err) {
        authToken = null;
        setAuthStatus('error', String(err));
      }
    }

    function reauth() {
      getPortalToken().then(() => {
        meta.events = []; meta.props = {}; meta.traits = [];
        fetchEventNames();
        fetchTraits();
      });
    }

    async function fetchEventNames() {
      meta.loadingEvents = true;
      renderFilters();
      try {
        const res = await fetch(`${baseUrl()}/api/v1/segments/meta/events?project_id=${encodeURIComponent(projectId())}`,
          { headers: authHeaders() });
        if (res.ok) meta.events = await res.json();
      } catch (_) {
        meta.events = [];
      } finally {
        meta.loadingEvents = false;
        renderFilters();
        renderPreview();
      }
    }

    async function fetchProperties(eventName) {
      if (!eventName || meta.props[eventName] !== undefined) return;
      meta.props[eventName] = [];   // prevent duplicate fetches
      meta.loadingProps.add(eventName);
      renderFilters();
      try {
        const res = await fetch(
          `${baseUrl()}/api/v1/segments/meta/events/${encodeURIComponent(eventName)}/properties?project_id=${encodeURIComponent(projectId())}`,
          { headers: authHeaders() }
        );
        if (res.ok) meta.props[eventName] = await res.json();
      } catch (_) {
        meta.props[eventName] = [];
      } finally {
        meta.loadingProps.delete(eventName);
        renderFilters();
        renderPreview();
      }
    }

    async function fetchTraits() {
      meta.loadingTraits = true;
      try {
        const res = await fetch(`${baseUrl()}/api/v1/segments/meta/traits?project_id=${encodeURIComponent(projectId())}`,
          { headers: authHeaders() });
        if (res.ok) meta.traits = await res.json();
      } catch (_) {
        meta.traits = [];
      } finally {
        meta.loadingTraits = false;
        renderFilters();
      }
    }

    // ── Config persistence ────────────────────────────────────
    function saveConfig() {
      localStorage.setItem('pam_seg_url',      document.getElementById('cfg-url').value);
      localStorage.setItem('pam_seg_project',  document.getElementById('cfg-project').value);
      localStorage.setItem('pam_seg_auth_url', document.getElementById('cfg-auth-url').value);
    }

    function loadConfig() {
      const url  = localStorage.getItem('pam_seg_url');
      const pid  = localStorage.getItem('pam_seg_project');
      const auth = localStorage.getItem('pam_seg_auth_url');
      if (url)  document.getElementById('cfg-url').value = url;
      if (pid)  document.getElementById('cfg-project').value = pid;
      if (auth) document.getElementById('cfg-auth-url').value = auth;
    }

    // ── Match mode ───────────────────────────────────────────
    function setMatch(mode) {
      matchMode = mode;
      document.getElementById('match-all').classList.toggle('active', mode === 'all');
      document.getElementById('match-any').classList.toggle('active', mode === 'any');
      renderPreview();
    }

    // ── Refresh strategy ─────────────────────────────────────
    function onRefreshChange() {
      const v = document.getElementById('seg-refresh').value;
      document.getElementById('seg-cron').style.display = v === 'scheduled' ? '' : 'none';
      renderPreview();
    }

    // ── Add filter ───────────────────────────────────────────
    function addFilter(type) {
      const id = nextId++;
      const f = { id, type };
      if (type === 'event' || type === 'did_not_do') {
        f.event_name = '';
        f.time_window = 30;
      }
      if (type === 'event') {
        f.freq_op   = 'gte';
        f.freq_count = 1;
        f.where_conditions = [];  // [{field, op, value}]
      }
      if (type === 'trait') {
        f.trait = '';
        f.op    = 'eq';
        f.value = '';
      }
      if (type === 'in_segment') {
        f.segment_id = '';
      }
      filters.push(f);
      renderFilters();
      renderPreview();
    }

    function removeFilter(id) {
      filters = filters.filter(f => f.id !== id);
      renderFilters();
      renderPreview();
    }

    // ── Where conditions (inside event filter) ───────────────
    function addWhere(filterId) {
      const f = filters.find(f => f.id === filterId);
      if (!f) return;
      f.where_conditions.push({ field: '', op: 'eq', value: '' });
      renderFilters();
      renderPreview();
    }

    function removeWhere(filterId, idx) {
      const f = filters.find(f => f.id === filterId);
      if (!f) return;
      f.where_conditions.splice(idx, 1);
      renderFilters();
      renderPreview();
    }

    function onEventNameChange(filterId) {
      syncFiltersFromDom();
      const f = filters.find(f => f.id === filterId);
      if (!f) return;
      f.where_conditions = [];   // reset property conditions when event changes
      fetchProperties(f.event_name);
      renderFilters();
      renderPreview();
    }

    // ── Read DOM → update filter state ───────────────────────
    function syncFiltersFromDom() {
      filters.forEach(f => {
        if (f.type === 'event') {
          f.event_name  = val(`f${f.id}-event_name`);
          f.freq_op     = val(`f${f.id}-freq_op`);
          f.freq_count  = parseInt(val(`f${f.id}-freq_count`)) || 1;
          f.time_window = parseInt(val(`f${f.id}-time_window`)) || 30;
          f.where_conditions.forEach((w, i) => {
            w.field = val(`f${f.id}-wfield-${i}`);
            w.op    = val(`f${f.id}-wop-${i}`);
            w.value = val(`f${f.id}-wvalue-${i}`);
          });
        }
        if (f.type === 'did_not_do') {
          f.event_name  = val(`f${f.id}-event_name`);
          f.time_window = parseInt(val(`f${f.id}-time_window`)) || 30;
        }
        if (f.type === 'trait') {
          f.trait = val(`f${f.id}-trait`);
          f.op    = val(`f${f.id}-op`);
          f.value = val(`f${f.id}-value`);
        }
        if (f.type === 'in_segment') {
          f.segment_id = val(`f${f.id}-segment_id`);
        }
      });
    }

    function val(id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    }

    // ── Render filter cards ──────────────────────────────────
    function renderFilters() {
      const container = document.getElementById('filters-container');
      if (filters.length === 0) {
        container.innerHTML = '<div class="text-dim" style="padding:4px 0">No filters yet — add one below.</div>';
        return;
      }
      container.innerHTML = filters.map((f, idx) => renderFilterCard(f, idx)).join('');
    }

    function renderFilterCard(f, idx) {
      const typeLabels = { event: 'EVENT', trait: 'TRAIT', did_not_do: 'DID NOT DO', in_segment: 'IN SEGMENT' };
      const typeClasses = { event: 'type-event', trait: 'type-trait', did_not_do: 'type-did-not', in_segment: 'type-segment' };

      let body = '';

      if (f.type === 'event') {
        const evtOpts = meta.loadingEvents
          ? `<option>Loading…</option>`
          : [`<option value="">— select event —</option>`,
             ...meta.events.map(e =>
               `<option value="${esc(e)}" ${f.event_name === e ? 'selected' : ''}>${esc(e)}</option>`)
            ].join('');
        body = `
          <div class="form-row">
            <label>Event name</label>
            <select class="field grow" id="f${f.id}-event_name"
                    onchange="onEventNameChange(${f.id})" ${meta.loadingEvents ? 'disabled' : ''}>
              ${evtOpts}
            </select>
          </div>
          <div class="form-row">
            <label>Frequency</label>
            <select class="field small" id="f${f.id}-freq_op" onchange="onFieldChange()">
              ${['eq','gte','gt','lte','lt'].map(op =>
                `<option value="${op}" ${f.freq_op === op ? 'selected' : ''}>${op}</option>`).join('')}
            </select>
            <input class="field small" type="number" min="1" id="f${f.id}-freq_count"
                   value="${f.freq_count}" oninput="onFieldChange()">
            <span class="text-dim">time(s)</span>
          </div>
          <div class="form-row">
            <label>Time window</label>
            <span class="text-dim">last</span>
            <input class="field small" type="number" min="1" max="365" id="f${f.id}-time_window"
                   value="${f.time_window}" oninput="onFieldChange()">
            <span class="text-dim">days</span>
          </div>
          ${renderWhereSection(f)}
        `;
      }

      if (f.type === 'did_not_do') {
        const evtOpts2 = meta.loadingEvents
          ? `<option>Loading…</option>`
          : [`<option value="">— select event —</option>`,
             ...meta.events.map(e =>
               `<option value="${esc(e)}" ${f.event_name === e ? 'selected' : ''}>${esc(e)}</option>`)
            ].join('');
        body = `
          <div class="form-row">
            <label>Event name</label>
            <select class="field grow" id="f${f.id}-event_name"
                    onchange="onFieldChange()" ${meta.loadingEvents ? 'disabled' : ''}>
              ${evtOpts2}
            </select>
          </div>
          <div class="form-row">
            <label>Time window</label>
            <span class="text-dim">last</span>
            <input class="field small" type="number" min="1" max="365" id="f${f.id}-time_window"
                   value="${f.time_window}" oninput="onFieldChange()">
            <span class="text-dim">days</span>
          </div>
        `;
      }

      if (f.type === 'trait') {
        const traitDatalist = meta.traits.length
          ? `<datalist id="traits-list">${meta.traits.map(t => `<option value="${esc(t)}">`).join('')}</datalist>`
          : '';
        body = `
          ${traitDatalist}
          <div class="form-row">
            <label>Trait</label>
            <input class="field grow" id="f${f.id}-trait" value="${esc(f.trait)}"
                   list="traits-list" placeholder="plan" oninput="onFieldChange()">
          </div>
          <div class="form-row">
            <label>Operator</label>
            <select class="field med" id="f${f.id}-op" onchange="onFieldChange()">
              ${TRAIT_OPS.map(op =>
                `<option value="${op}" ${f.op === op ? 'selected' : ''}>${op}</option>`).join('')}
            </select>
          </div>
          <div class="form-row">
            <label>Value</label>
            <input class="field grow" id="f${f.id}-value" value="${esc(f.value)}"
                   placeholder="pro" oninput="onFieldChange()">
          </div>
        `;
      }

      if (f.type === 'in_segment') {
        body = `
          <div class="form-row">
            <label>Segment ID</label>
            <input class="field grow" id="f${f.id}-segment_id" value="${esc(f.segment_id)}"
                   placeholder="seg_vip_users" oninput="onFieldChange()">
          </div>
        `;
      }

      const connector = idx < filters.length - 1
        ? `<div style="text-align:center; padding:4px 0; font-size:11px; font-weight:700; letter-spacing:1px; color:var(--text-dim)">${matchMode.toUpperCase()}</div>`
        : '';

      return `
        <div class="filter-card" id="filter-card-${f.id}">
          <div class="filter-head">
            <span class="filter-type-badge ${typeClasses[f.type]}">${typeLabels[f.type]}</span>
            <span class="filter-num">filter ${idx + 1}</span>
            <span style="flex:1"></span>
            <button class="btn btn-danger" onclick="removeFilter(${f.id})" title="Remove">✕</button>
          </div>
          <div class="filter-body">${body}</div>
        </div>
        ${connector}
      `;
    }

    function renderWhereSection(f) {
      const noEvent = !f.event_name;
      const columns = meta.props[f.event_name] || [];
      const canAdd  = !noEvent;
      const addHint = noEvent ? 'Select an event first' : '';

      if (f.where_conditions.length === 0) {
        return `
          <div style="margin-top:4px">
            <button class="btn btn-ghost" onclick="addWhere(${f.id})" style="font-size:11px"
                    ${canAdd ? '' : 'disabled'} title="${addHint}">
              + Add property condition
            </button>
            ${addHint ? `<span class="text-dim" style="font-size:11px; margin-left:8px">${addHint}</span>` : ''}
          </div>
        `;
      }

      const buildFieldSelect = (w, i) => {
        if (noEvent) return `<input class="field grow" id="f${f.id}-wfield-${i}" value="${esc(w.field)}" disabled placeholder="select event first">`;
        return `
          <select class="field grow" id="f${f.id}-wfield-${i}" onchange="onFieldChange()">
            <option value="">— column —</option>
            ${columns.map(c => `<option value="${c}" ${w.field === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        `;
      };

      const rows = f.where_conditions.map((w, i) => `
        <div class="where-row">
          ${buildFieldSelect(w, i)}
          <select class="field med" id="f${f.id}-wop-${i}" onchange="onFieldChange()">
            ${OPERATORS.map(op =>
              `<option value="${op}" ${w.op === op ? 'selected' : ''}>${op}</option>`).join('')}
          </select>
          <input class="field grow" id="f${f.id}-wvalue-${i}" value="${esc(w.value)}"
                 placeholder="value" oninput="onFieldChange()">
          <button class="btn btn-danger" onclick="removeWhere(${f.id}, ${i})" title="Remove">✕</button>
        </div>
      `).join('');

      return `
        <div class="where-section">
          <div class="where-head">
            <span>Column conditions (WHERE)</span>
            <button class="btn btn-ghost" onclick="addWhere(${f.id})"
                    style="font-size:11px; padding:2px 8px" ${canAdd ? '' : 'disabled'}>+ Add</button>
          </div>
          <div class="where-rows">${rows}</div>
        </div>
      `;
    }

    // ── Build DSL from state ──────────────────────────────────
    function buildDSL() {
      const filters_dsl = filters.map(f => {
        if (f.type === 'event') {
          const dsl = {
            type: 'event',
            event_name: f.event_name || 'unnamed_event',
            frequency: { op: f.freq_op, count: f.freq_count },
            time_window: { last_days: f.time_window },
          };
          if (f.where_conditions.length > 0) {
            dsl.where = {};
            f.where_conditions.forEach(w => {
              if (w.field) {
                dsl.where[w.field] = w.op === 'exists'
                  ? { op: w.op }
                  : { op: w.op, value: parseValue(w.value) };
              }
            });
          }
          return dsl;
        }
        if (f.type === 'did_not_do') {
          return {
            type: 'did_not_do',
            event_name: f.event_name || 'unnamed_event',
            time_window: { last_days: f.time_window },
          };
        }
        if (f.type === 'trait') {
          const dsl = { type: 'trait', trait: f.trait || 'unnamed_trait', op: f.op };
          if (f.op !== 'exists') dsl.value = parseValue(f.value);
          return dsl;
        }
        if (f.type === 'in_segment') {
          return { type: 'in_segment', segment_id: f.segment_id || 'seg_unknown' };
        }
      });

      return {
        segment_id:       document.getElementById('seg-id').value || 'seg_unnamed',
        name:             document.getElementById('seg-name').value || 'Unnamed segment',
        refresh_strategy: document.getElementById('seg-refresh').value,
        ...(document.getElementById('seg-refresh').value === 'scheduled'
            ? { scheduled_cron: document.getElementById('seg-cron').value || '0 */6 * * *' }
            : {}),
        rule: {
          version: 1,
          match: matchMode,
          filters: filters_dsl,
        },
      };
    }

    function parseValue(v) {
      if (v === 'true') return true;
      if (v === 'false') return false;
      const n = Number(v);
      if (!isNaN(n) && v.trim() !== '') return n;
      return v;
    }

    // ── Validate DSL ─────────────────────────────────────────
    function validate(dsl) {
      const errs = [];
      if (!dsl.segment_id.match(/^seg_[a-z0-9_]+$/)) errs.push('segment_id must match seg_[a-z0-9_]+');
      if (dsl.rule.filters.length === 0) errs.push('At least one filter is required');
      if (dsl.rule.filters.length > 10) errs.push('Max 10 filters per segment (v1 limit)');
      dsl.rule.filters.forEach((f, i) => {
        if ((f.type === 'event' || f.type === 'did_not_do') && f.time_window?.last_days > 365)
          errs.push(`Filter ${i + 1}: time window cannot exceed 365 days`);
        if (f.type === 'event' && !f.event_name)
          errs.push(`Filter ${i + 1}: event_name is required`);
        if (f.type === 'trait' && !f.trait)
          errs.push(`Filter ${i + 1}: trait name is required`);
      });
      return errs;
    }

    // ── Render DSL preview ───────────────────────────────────
    function renderPreview() {
      syncFiltersFromDom();
      const dsl = buildDSL();
      const json = JSON.stringify(dsl, null, 2);
      document.getElementById('dsl-preview').innerHTML = highlight(json);
      document.getElementById('filter-count').textContent =
        `${filters.length} filter${filters.length !== 1 ? 's' : ''}`;

      const errs = validate(dsl);
      const errEl = document.getElementById('validation-err');
      if (errs.length) {
        errEl.style.display = '';
        errEl.textContent = errs.join(' · ');
      } else {
        errEl.style.display = 'none';
      }
    }

    function onFieldChange() { renderPreview(); }

    // ── Create segment ───────────────────────────────────────
    async function createSegment() {
      syncFiltersFromDom();
      const dsl  = buildDSL();
      const errs = validate(dsl);

      if (errs.length) {
        document.getElementById('res-body').innerHTML =
          `<span style="color:var(--red)">${errs.join('\n')}</span>`;
        return;
      }

      const base = document.getElementById('cfg-url').value.replace(/\/$/, '');

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = 'Creating…';

      const t0 = performance.now();
      try {
        const res = await fetch(`${base}/api/v1/segments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify(dsl),
        });

        const ms = Math.round(performance.now() - t0);
        let data = null;
        try { data = await res.json(); } catch (_) {}

        const cls = res.status < 300 ? 's2xx' : res.status < 500 ? 's4xx' : 's5xx';
        document.getElementById('res-meta').innerHTML =
          `<span class="status-badge ${cls}">${res.status} ${res.statusText}</span>`;
        document.getElementById('res-elapsed').textContent = `${ms}ms`;
        document.getElementById('res-body').innerHTML = data !== null
          ? highlight(JSON.stringify(data, null, 2))
          : '<span style="color:var(--text-dim)">(empty body)</span>';

      } catch (err) {
        document.getElementById('res-meta').innerHTML =
          `<span class="status-badge s4xx">Network Error</span>`;
        document.getElementById('res-elapsed').textContent = '';
        document.getElementById('res-body').textContent =
          String(err) + '\n\nIs segmentation-engine running on port 8003?';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Segment';
      }
    }

    // ── JSON highlight ───────────────────────────────────────
    function highlight(json) {
      return escHtml(json).replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
        match => {
          if (/^"/.test(match)) {
            if (/:$/.test(match)) return `<span class="jk">${match}</span>`;
            return `<span class="js">${match}</span>`;
          }
          if (/true|false/.test(match)) return `<span class="jb">${match}</span>`;
          if (/null/.test(match))       return `<span class="jl">${match}</span>`;
          return `<span class="jn">${match}</span>`;
        }
      );
    }

    function esc(s) { return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Init ─────────────────────────────────────────────────
    loadConfig();
    renderFilters();
    renderPreview();
    getPortalToken().then(() => {
      fetchEventNames();
      fetchTraits();
    });
  </script>

</body>
</html>
