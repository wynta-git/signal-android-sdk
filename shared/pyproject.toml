[project]
name = "pam-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "motor>=3.5.0",
    "redis[asyncio]>=5.0.0",
    "clickhouse-connect>=0.7.0",
    "pydantic>=2.7.0",
    "aiokafka>=0.10.0",
    "structlog>=24.0.0",
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
