[project]
name = "pam-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "motor>=3.5.0",
    "redis[asyncio]>=5.0.0",
    "clickhouse-connect>=0.7.0",
    "pydantic>=2.7.0",
    "aiokafka>=0.10.0",
    "aiomysql>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
