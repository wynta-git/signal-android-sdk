function Sidebar({ active, onNav }) {
  const sections = [
    {
      label: 'Analytics',
      items: [
        { id: 'dashboard', label: 'Dashboard', icon: 'home', useIcon: true },
      ],
    },
    {
      label: 'Bonus',
      items: [
        { id: 'heads',     label: 'Bonus Heads',      icon: 'folders' },
        { id: 'subheads',  label: 'Subheads',         icon: 'folder-tree' },
        { id: 'configures',label: 'Configures',       icon: 'settings-2' },
        { id: 'codes',     label: 'Promo Codes',      icon: 'ticket' },
      ],
    },
    {
      label: 'Admin',
      items: [
        { id: 'players',   label: 'Players',  icon: 'users' },
        { id: 'reports',   label: 'Reports',  icon: 'bar-chart-3' },
        { id: 'settings',  label: 'Settings', icon: 'settings' },
      ],
    },
  ];

  return (
    <aside className="sidebar">
      <div className="brand-bar">
        <img src={WYNTA_LOGO} alt="Wynta"/>
        <span className="brand-suffix">BONUS</span>
      </div>
      <div className="nav-scroll">
        {sections.map((sec, i) => (
          <div key={i}>
            <div className="nav-section-label">{sec.label}</div>
            {sec.items.map(it => (
              <div
                key={it.id}
                className={'nav-item' + (active === it.id ? ' active' : '')}
                onClick={() => onNav(it.id)}
                role="button"
                aria-current={active === it.id ? 'page' : undefined}
              >
                <Icon name={it.icon} size={16} strokeWidth={1.8}/>
                <span>{it.label}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </aside>
  );
}

/* ============================================================
 * Global search — players, segments, promo codes, bonus configs
 * ============================================================ */
function GlobalSearch({ onSelectNode }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const [activeIdx, setActiveIdx] = useState(0);
  const [profilePlayer, setProfilePlayer] = useState(null);
  const [viewSegment, setViewSegment] = useState(null);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);

  const q = query.trim();
  const results = useMemo(() => buildSearchResults(q), [q]);
  // Flatten for keyboard nav (skip group headers)
  const flatResults = useMemo(() => results.flatMap(g => g.items), [results]);

  useEffect(() => { setActiveIdx(0); }, [query]);

  const runResult = (r) => {
    setOpen(false);
    setQuery('');
    if (r.kind === 'player')       setProfilePlayer(r.payload);
    else if (r.kind === 'segment') setViewSegment(r.payload);
    else if (r.kind === 'code') {
      onSelectNode && onSelectNode({ type: 'configure', id: r.parentId });
      // After the configure detail renders, ask the PromoCodeRow with this id
      // to expand + flash + scroll into view.
      setTimeout(() => {
        window.dispatchEvent(new CustomEvent('wynta:highlight-code', { detail: { codeId: r.payload.id } }));
      }, 80);
    }
    else if (r.kind === 'head')    onSelectNode && onSelectNode({ type: 'head', id: r.payload.id });
    else if (r.kind === 'subhead') onSelectNode && onSelectNode({ type: 'subhead', id: r.payload.id });
    else if (r.kind === 'configure') onSelectNode && onSelectNode({ type: 'configure', id: r.payload.id });
  };

  const onKeyDown = (e) => {
    if (e.key === 'Escape') { setOpen(false); return; }
    if (flatResults.length === 0) {
      if (e.key === 'Enter' && /^\d+$/.test(q) && q.length >= 3) {
        runResult({ kind: 'player', payload: makePlayerById(parseInt(q, 10)) });
        e.preventDefault();
      }
      return;
    }
    if (e.key === 'ArrowDown') { setActiveIdx(i => Math.min(flatResults.length - 1, i + 1)); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { setActiveIdx(i => Math.max(0, i - 1)); e.preventDefault(); }
    else if (e.key === 'Enter') { runResult(flatResults[activeIdx]); e.preventDefault(); }
  };

  let runningIdx = -1;
  return (
    <div className="search" ref={ref}>
      <span className="search-icon"><Icon name="search" size={14}/></span>
      <input
        placeholder="Search players, segments, codes, configs…"
        value={query}
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => { if (query) setOpen(true); }}
        onKeyDown={onKeyDown}
      />
      {open && q && (
        <div className="gp-pop">
          {flatResults.length === 0 ? (
            <div className="gp-pop-empty">No matches for “{q}”</div>
          ) : (
            <>
              {results.map(group => group.items.length > 0 && (
                <React.Fragment key={group.kind}>
                  <div className="gp-pop-header">
                    <span>{group.label}</span>
                    <span>{group.items.length}</span>
                  </div>
                  {group.items.map(item => {
                    runningIdx += 1;
                    const i = runningIdx;
                    return (
                      <SearchResultRow
                        key={group.kind + ':' + (item.payload.id ?? item.payload.code ?? i)}
                        item={item}
                        active={i === activeIdx}
                        onHover={() => setActiveIdx(i)}
                        onClick={() => runResult(item)}
                      />
                    );
                  })}
                </React.Fragment>
              ))}
              <div className="gp-pop-hint">
                <kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close
              </div>
            </>
          )}
        </div>
      )}
      {profilePlayer && (
        <PlayerProfileModal
          player={profilePlayer}
          segment={null}
          onClose={() => setProfilePlayer(null)}
        />
      )}
      {viewSegment && (
        <SegmentPlayersModal
          segment={viewSegment}
          onClose={() => setViewSegment(null)}
        />
      )}
    </div>
  );
}

function SearchResultRow({ item, active, onHover, onClick }) {
  const cls = 'gp-pop-item' + (active ? ' active' : '');
  if (item.kind === 'player') {
    const p = item.payload;
    return (
      <div className={cls} onMouseEnter={onHover} onClick={onClick}>
        <span className="avatar">{_initials(p.name)}</span>
        <div className="ident">
          <div className="name">{p.name}</div>
          <div className="sub">{p.email} · {p.state}</div>
        </div>
        <span className="pid">#{p.id}</span>
      </div>
    );
  }
  if (item.kind === 'segment') {
    const s = item.payload;
    return (
      <div className={cls} onMouseEnter={onHover} onClick={onClick}>
        <span className="gp-mark seg"><Icon name="users" size={13}/></span>
        <div className="ident">
          <div className="name">{s.label}</div>
          <div className="sub">{s.hint}</div>
        </div>
        <span className="pid">{s.count.toLocaleString('en-IN')}</span>
      </div>
    );
  }
  if (item.kind === 'code') {
    return (
      <div className={cls} onMouseEnter={onHover} onClick={onClick}>
        <span className="gp-mark code"><Icon name="ticket" size={13}/></span>
        <div className="ident">
          <div className="name" style={{ fontFamily: 'var(--mono)' }}>{item.payload.code}</div>
          <div className="sub">{item.parentName}</div>
        </div>
        <span className="pid">Configure #{item.parentId}</span>
      </div>
    );
  }
  if (item.kind === 'head' || item.kind === 'subhead' || item.kind === 'configure') {
    const icon = item.kind === 'head' ? 'folder' : item.kind === 'subhead' ? 'layers' : 'sliders-horizontal';
    return (
      <div className={cls} onMouseEnter={onHover} onClick={onClick}>
        <span className="gp-mark cfg"><Icon name={icon} size={13}/></span>
        <div className="ident">
          <div className="name">{item.payload.name}</div>
          <div className="sub">{item.crumb}</div>
        </div>
        <span className="pid" style={{ textTransform: 'capitalize' }}>{item.kind}</span>
      </div>
    );
  }
  return null;
}

function buildSearchResults(q) {
  const out = [
    { kind: 'player',    label: 'Players',          items: [] },
    { kind: 'segment',   label: 'Player Segments',  items: [] },
    { kind: 'code',      label: 'Promo Codes',      items: [] },
    { kind: 'config',    label: 'Bonus Configs',    items: [] },
  ];
  if (!q) return out;
  const needle = q.toLowerCase();
  const isNum = /^\d+$/.test(q) && q.length >= 3;

  // Players
  if (isNum) {
    out[0].items.push({ kind: 'player', payload: makePlayerById(parseInt(q, 10)) });
  } else {
    const pool = getGlobalPlayerPool();
    for (const p of pool) {
      if (
        p.name.toLowerCase().includes(needle) ||
        p.email.toLowerCase().includes(needle) ||
        String(p.id).includes(q)
      ) {
        out[0].items.push({ kind: 'player', payload: p });
        if (out[0].items.length >= 5) break;
      }
    }
  }

  // Segments
  const segs = (typeof MANUAL_SEGMENTS !== 'undefined') ? MANUAL_SEGMENTS : [];
  for (const s of segs) {
    if (s.label.toLowerCase().includes(needle) || (s.hint || '').toLowerCase().includes(needle) || s.id.toLowerCase().includes(needle)) {
      out[1].items.push({ kind: 'segment', payload: s });
      if (out[1].items.length >= 5) break;
    }
  }

  // Promo codes (scan all configures)
  if (typeof MOCK_CONFIGURES !== 'undefined') {
    outer: for (const cid in MOCK_CONFIGURES) {
      const cfg = MOCK_CONFIGURES[cid];
      if (!cfg.codes) continue;
      for (const code of cfg.codes) {
        if (code.code && code.code.toLowerCase().includes(needle)) {
          out[2].items.push({
            kind: 'code',
            payload: code,
            parentId: cfg.id,
            parentName: cfg.name,
          });
          if (out[2].items.length >= 5) break outer;
        }
      }
    }
  }

  // Bonus configs — heads, subheads, configures
  if (typeof MOCK_HEADS !== 'undefined') {
    for (const hid in MOCK_HEADS) {
      const h = MOCK_HEADS[hid];
      if (h.name.toLowerCase().includes(needle)) {
        out[3].items.push({ kind: 'head', payload: h, crumb: 'Bonus head' });
        if (out[3].items.length >= 8) break;
      }
    }
  }
  if (typeof MOCK_SUBHEADS !== 'undefined' && out[3].items.length < 8) {
    for (const sid in MOCK_SUBHEADS) {
      const s = MOCK_SUBHEADS[sid];
      if (s.name.toLowerCase().includes(needle)) {
        out[3].items.push({ kind: 'subhead', payload: s, crumb: s.parent_head_name });
        if (out[3].items.length >= 8) break;
      }
    }
  }
  if (typeof MOCK_CONFIGURES !== 'undefined' && out[3].items.length < 8) {
    for (const cid in MOCK_CONFIGURES) {
      const c = MOCK_CONFIGURES[cid];
      if (c.name.toLowerCase().includes(needle)) {
        const sub = MOCK_SUBHEADS[c.subhead_id];
        const crumb = sub ? (sub.parent_head_name + ' › ' + sub.name) : 'Configure';
        out[3].items.push({ kind: 'configure', payload: c, crumb });
        if (out[3].items.length >= 8) break;
      }
    }
  }
  return out;
}

function Topbar({ selectedNode, onClearSelection, selectedBrand, onBrandChange, onSelectNode }) {
  // Breadcrumb from selectedNode
  const crumbs = [{ label: 'Bonus', onClick: onClearSelection }];
  if (selectedNode) {
    if (selectedNode.type === 'head') {
      const h = MOCK_HEADS[selectedNode.id];
      if (h) crumbs.push({ label: h.name, current: true });
    } else if (selectedNode.type === 'subhead') {
      const s = MOCK_SUBHEADS[selectedNode.id];
      if (s) {
        crumbs.push({ label: s.parent_head_name });
        crumbs.push({ label: s.name, current: true });
      }
    } else if (selectedNode.type === 'configure') {
      const c = MOCK_CONFIGURES[selectedNode.id];
      const s = c && MOCK_SUBHEADS[c.subhead_id];
      if (s) {
        crumbs.push({ label: s.parent_head_name });
        crumbs.push({ label: s.name });
        // For configure names like "Weekly Rummy Leaderboard — RUMMY_LB",
        // show only the human name in the crumb; the code is surfaced
        // elsewhere (promo codes panel, detail header).
        const fullName = c.name;
        const shortName = fullName.split(/\s+[—–-]\s+/)[0];
        crumbs.push({ label: shortName, fullLabel: fullName, current: true });
      }
    }
  }

  return (
    <div className="main-topbar">
      <div className="tb-brand">
        <img src={WYNTA_LOGO} alt="Wynta" className="tb-logo"/>
        <span className="tb-brand-divider"></span>
        <BrandSwitcher value={selectedBrand} onChange={onBrandChange} compact/>
      </div>
      <div className="crumb">
        {crumbs.map((c, i) => (
          <React.Fragment key={i}>
            {i > 0 && <span className="sep"><Icon name="chevron-right" size={12}/></span>}
            {c.current ? (
              <span className="current" title={c.fullLabel || c.label}>{c.label}</span>
            ) : (
              <span title={c.fullLabel || c.label} style={{ cursor: c.onClick ? 'pointer' : 'default' }} onClick={c.onClick}>{c.label}</span>
            )}
          </React.Fragment>
        ))}
      </div>
      <div className="spacer"/>
      <GlobalSearch onSelectNode={onSelectNode}/>
      <button className="icon-btn" title="Filters"><Icon name="filter" size={15}/></button>
      <button className="icon-btn" title="Notifications"><Icon name="bell" size={15}/></button>
      <div className="avatar" title="vanessa@wynta.com">V</div>
    </div>
  );
}

function App() {
  const [sidebarActive, setSidebarActive] = useState('dashboard');
  const [selectedBrand, setSelectedBrand] = useState('TR');

  // Tree state
  const [expandedHeads, setExpandedHeads] = useState(() => new Set([2, 4]));
  const [expandedSubheads, setExpandedSubheads] = useState(() => new Set([25, 26, 41]));
  const [loadingSubheads, setLoadingSubheads] = useState(() => new Set());
  const [selectedNode, setSelectedNode] = useState({ type: 'subhead', id: 26 });

  // Drawer + context menu + toast
  const [drawerState, setDrawerState] = useState(null);
  const [historyDrawer, setHistoryDrawer] = useState(null);
  const [contextMenu, setContextMenu] = useState(null);
  const [toast, setToast] = useState('');

  const heads = useMemo(() => Object.values(MOCK_HEADS), []);

  const toggleHead = useCallback((id) => {
    setExpandedHeads(p => {
      const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n;
    });
  }, []);

  const toggleSubhead = useCallback((id) => {
    setExpandedSubheads(p => {
      const n = new Set(p);
      if (n.has(id)) {
        n.delete(id);
      } else {
        // Simulate loading delay
        setLoadingSubheads(prev => { const x = new Set(prev); x.add(id); return x; });
        setTimeout(() => {
          setLoadingSubheads(prev => { const x = new Set(prev); x.delete(id); return x; });
        }, 220);
        n.add(id);
      }
      return n;
    });
  }, []);

  const handleSelectNode = useCallback((node) => {
    setSelectedNode(node);
    // Auto-expand ancestors so the node is visible
    if (node.type === 'subhead') {
      const s = MOCK_SUBHEADS[node.id];
      if (s) setExpandedHeads(p => { const n = new Set(p); n.add(s.parent_head_id); return n; });
    } else if (node.type === 'configure') {
      const c = MOCK_CONFIGURES[node.id];
      const s = c && MOCK_SUBHEADS[c.subhead_id];
      if (s) {
        setExpandedHeads(p => { const n = new Set(p); n.add(s.parent_head_id); return n; });
        setExpandedSubheads(p => { const n = new Set(p); n.add(c.subhead_id); return n; });
      }
    }
  }, []);

  const openMenu = useCallback((m) => setContextMenu(m), []);
  const closeMenu = useCallback(() => setContextMenu(null), []);

  const openDrawer = useCallback((s) => {
    if (s && s.type === 'OPEN_HISTORY') {
      setHistoryDrawer({ type: s.nodeType, id: s.id });
      return;
    }
    setDrawerState(s);
  }, []);
  const closeDrawer = useCallback(() => setDrawerState(null), []);
  const handleSubmit = useCallback((data) => {
    closeDrawer();
    const msgs = {
      NEW_HEAD: 'Bonus head created',
      EDIT_HEAD: 'Bonus head updated',
      NEW_SUBHEAD: 'Subhead created',
      EDIT_SUBHEAD: 'Subhead updated',
      NEW_CONFIGURE: 'Configure created',
      EDIT_CONFIGURE: 'Configure updated',
      NEW_PROMOCODE: 'Promo code added',
      NEW_ELIGIBILITY: 'Eligibility criterion added',
      NEW_TRIGGER: 'Release trigger added',
      EDIT_BUDGET: 'Budget updated',
      NEW_MANUAL_BONUS: 'Manual bonus campaign created',
      ISSUE_CODE_BONUS: 'Bonus issued to audience',
    };
    setToast(msgs[data.type] || 'Saved');
  }, []);

  // Context menu items per node type
  const menuItems = useMemo(() => {
    if (!contextMenu) return [];
    if (contextMenu.type === 'head') {
      return [
        { icon: 'pencil',      label: 'Edit Head',     onClick: () => openDrawer({ type: 'EDIT_HEAD', id: contextMenu.id }) },
        { icon: 'plus-circle', label: 'Add Subhead',   onClick: () => openDrawer({ type: 'NEW_SUBHEAD', parentId: contextMenu.id }) },
        { icon: 'wallet',      label: 'Manage Budget', onClick: () => openDrawer({ type: 'EDIT_BUDGET', scope: 'head', id: contextMenu.id }) },
        { sep: true },
        { icon: 'eye',         label: 'View Details',  onClick: () => handleSelectNode({ type: 'head', id: contextMenu.id }) },
      ];
    }
    if (contextMenu.type === 'subhead') {
      return [
        { icon: 'pencil',      label: 'Edit Subhead',   onClick: () => openDrawer({ type: 'EDIT_SUBHEAD', id: contextMenu.id }) },
        { icon: 'plus-circle', label: 'Add Configure',  onClick: () => openDrawer({ type: 'NEW_CONFIGURE', parentId: contextMenu.id }) },
        { icon: 'wallet',      label: 'Manage Budget',  onClick: () => openDrawer({ type: 'EDIT_BUDGET', scope: 'subhead', id: contextMenu.id }) },
        { sep: true },
        { icon: 'eye',         label: 'View Details',   onClick: () => handleSelectNode({ type: 'subhead', id: contextMenu.id }) },
      ];
    }
    if (contextMenu.type === 'configure') {
      return [
        { icon: 'pencil', label: 'Edit Configure',     onClick: () => openDrawer({ type: 'EDIT_CONFIGURE', id: contextMenu.id }) },
        { icon: 'zap',    label: 'Add Trigger',        onClick: () => openDrawer({ type: 'NEW_TRIGGER', parentId: contextMenu.id }) },
        { icon: 'ticket', label: 'Add Promo Code',     onClick: () => openDrawer({ type: 'NEW_PROMOCODE', parentId: contextMenu.id }) },
        { icon: 'wallet', label: 'Manage Budget',      onClick: () => openDrawer({ type: 'EDIT_BUDGET', scope: 'configure', id: contextMenu.id }) },
        { sep: true },
        { icon: 'eye',    label: 'View Details',       onClick: () => handleSelectNode({ type: 'configure', id: contextMenu.id }) },
      ];
    }
    return [];
  }, [contextMenu, openDrawer, handleSelectNode]);

  return (
    <div className="shell">
      <main className="main">
        <Topbar
          selectedNode={selectedNode}
          onClearSelection={() => setSelectedNode(null)}
          selectedBrand={selectedBrand}
          onBrandChange={(id) => { setSelectedBrand(id); setToast('Switched to ' + BRANDS.find(b=>b.id===id)?.name); }}
          onSelectNode={handleSelectNode}
        />
        <KpiStrip/>
        <div className="three-zone">
          <HierarchyTree
            heads={heads}
            expandedHeads={expandedHeads}
            expandedSubheads={expandedSubheads}
            loadingSubheads={loadingSubheads}
            selectedNode={selectedNode}
            onSelectNode={handleSelectNode}
            onToggleHead={toggleHead}
            onToggleSubhead={toggleSubhead}
            onAddHead={() => openDrawer({ type: 'NEW_HEAD' })}
            onMenu={openMenu}
            selectedBrand={selectedBrand}
            onBrandChange={(id) => { setSelectedBrand(id); setToast('Switched to ' + id); }}
          />
          <div className="detail-panel">
            <DetailPanel
              selectedNode={selectedNode}
              onSelect={handleSelectNode}
              onAction={openDrawer}
            />
          </div>
        </div>
      </main>

      <SlideDrawer state={drawerState} onClose={closeDrawer} onSubmit={handleSubmit}/>
      <HistoryDrawer state={historyDrawer} onClose={() => setHistoryDrawer(null)}/>

      {contextMenu && (
        <ContextMenu
          x={contextMenu.x} y={contextMenu.y}
          items={menuItems}
          onClose={closeMenu}
        />
      )}

      <Toast message={toast} onDone={() => setToast('')}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
</body>
</html>
