// ============================================================
// Aggregation helpers
// ============================================================
function _emptyUsage() {
  return _u([0,'0.00'],[0,'0.00'],[0,'0.00'],[0,'0.00'],[0,'0.00']);
}
function _sumUsage(into, from) {
  if (!from) return into;
  for (const s of LIFECYCLE_STATES) {
    into.states[s].count  += from.states[s].count;
    into.states[s].amount = (parseFloat(into.states[s].amount) + parseFloat(from.states[s].amount)).toFixed(2);
  }
  return into;
}

function getUsage(type, id) {
  if (type === 'configure') return CONFIGURE_USAGE[id] || _emptyUsage();
  if (type === 'code')      return CODE_USAGE[id]      || _emptyUsage();
  if (type === 'subhead') {
    const sub = MOCK_SUBHEADS[id];
    if (!sub) return _emptyUsage();
    const agg = _emptyUsage();
    for (const cfgId of sub.configures) _sumUsage(agg, CONFIGURE_USAGE[cfgId]);
    return agg;
  }
  if (type === 'head') {
    const head = MOCK_HEADS[id];
    if (!head) return _emptyUsage();
    const agg = _emptyUsage();
    for (const sh of head.subheads) {
      const sub = MOCK_SUBHEADS[sh.id];
      if (!sub) continue;
      for (const cfgId of sub.configures) _sumUsage(agg, CONFIGURE_USAGE[cfgId]);
    }
    return agg;
  }
  return _emptyUsage();
}

function usageGranted(usage) {
  if (!usage) return 0;
  let total = 0;
  for (const s of LIFECYCLE_STATES) total += parseFloat(usage.states[s].amount) || 0;
  return total;
}

function getBudget(type, id) {
  if (type === 'head')      return MOCK_HEADS[id]?.budget || [];
  if (type === 'subhead')   return MOCK_SUBHEADS[id]?.budget || [];
  if (type === 'configure') return CONFIGURE_BUDGETS[id] || _inheritBudgetForConfigure(id) || [];
  if (type === 'code')      return CODE_BUDGETS[id]      || _inheritBudgetForCode(id)      || [];
  return [];
}

function _inheritBudgetForConfigure(id) {
  const cfg = MOCK_CONFIGURES[id];
  if (!cfg) return null;
  const sub = MOCK_SUBHEADS[cfg.subhead_id];
  return sub ? sub.budget : null;
}
function _inheritBudgetForCode(id) {
  for (const cfg of Object.values(MOCK_CONFIGURES)) {
    if (cfg.codes && cfg.codes.find(c => c.id === id)) {
      return CONFIGURE_BUDGETS[cfg.id] || _inheritBudgetForConfigure(cfg.id);
    }
  }
  return null;
}

function isBudgetInherited(type, id) {
  if (type === 'configure') return !CONFIGURE_BUDGETS[id];
  if (type === 'code')      return !CODE_BUDGETS[id];
  return false;
}

<script type="text/babel" data-presets="react">
/* Wynta Bonus Admin — shared primitives */

const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
 * Lucide icon (uses CDN script — created via createIcons on mount)
 * ============================================================ */
function Icon({ name, size = 16, color, strokeWidth = 1.8, style = {} }) {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const s = { width: size, height: size, display: 'inline-flex', flexShrink: 0, strokeWidth, ...style };
  if (color) s.color = color;
  return <i data-lucide={name} style={s} />;
}

/* ============================================================
 * useCountUp — animate a number from 0 → target on mount
 * ============================================================ */
function useCountUp(target, duration = 600, formatter = (n) => Math.round(n)) {
  const [value, setValue] = useState(0);
  const startedRef = useRef(false);
  useEffect(() => {
    if (!isFinite(target)) { setValue(target); return; }
    startedRef.current = true;
    const start = performance.now();
    let raf;
    const tick = (t) => {
      const elapsed = Math.min(1, (t - start) / duration);
      // easeOutCubic
      const e = 1 - Math.pow(1 - elapsed, 3);
      setValue(target * e);
      if (elapsed < 1) raf = requestAnimationFrame(tick);
      else setValue(target);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return formatter(value);
}

function CountUp({ value, duration = 600, format }) {
  const display = useCountUp(value, duration, format || ((n) => Math.round(n).toLocaleString('en-IN')));
  return <>{display}</>;
}

/* ============================================================
 * BudgetRing — animated SVG progress ring
 * ============================================================ */
function BudgetRing({ used, limit, size = 64, stroke = 5 }) {
  const r = (size - stroke) / 2 - 2;
  const C = 2 * Math.PI * r;
  const usedN = parseFloat(used || '0') || 0;
  const limitN = limit === null ? null : (parseFloat(limit) || 0);
  const pct = limitN === null || limitN === 0 ? null : Math.min(1, usedN / limitN);

  // animate via state — mount-trigger
  const [animated, setAnimated] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setAnimated(pct === null ? 0 : pct), 30);
    return () => clearTimeout(t);
  }, [pct]);

  let color = 'var(--g300)';
  if (pct !== null) {
    if (pct < 0.6)       color = 'var(--ok)';
    else if (pct < 0.8)  color = 'var(--warn)';
    else                 color = 'var(--err)';
  }

  const cx = size / 2, cy = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flexShrink: 0 }}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--g150)" strokeWidth={stroke}/>
      {pct !== null && (
        <circle
          cx={cx} cy={cy} r={r}
          fill="none"
          stroke={color}
          strokeWidth={stroke}
          strokeDasharray={C}
          strokeDashoffset={C * (1 - animated)}
          strokeLinecap="round"
          transform={`rotate(-90 ${cx} ${cy})`}
          style={{ transition: 'stroke-dashoffset 0.8s ease-out, stroke 0.3s' }}
        />
      )}
      <text
        x={cx} y={cy + 4}
        textAnchor="middle"
        fontSize="12.5"
        fill="var(--g700)"
        fontWeight="700"
        style={{ fontVariantNumeric: 'tabular-nums' }}
      >
        {pct === null ? '∞' : `${Math.round(pct * 100)}%`}
      </text>
    </svg>
  );
}

/* ============================================================
 * ValidityBar — horizontal start→today→end timeline
 * ============================================================ */
function ValidityBar({ start, end }) {
  const startMs = new Date(start).getTime();
  const endMs = new Date(end).getTime();
  const nowMs = Date.now();
  // Hack: use a fixed "today" for repeatable demo (matches data.js)
  const fixedNow = new Date('2026-05-16T12:00:00Z').getTime();
  const today = fixedNow;

  const totalRange = endMs - startMs;
  const elapsed = Math.max(0, Math.min(totalRange, today - startMs));
  const pct = totalRange > 0 ? (elapsed / totalRange) * 100 : 0;
  const finalPct = Math.max(0, Math.min(100, pct));
  const status = today < startMs ? 'upcoming' : today > endMs ? 'ended' : 'active';

  const [animated, setAnimated] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setAnimated(finalPct), 30);
    return () => clearTimeout(t);
  }, [finalPct]);

  return (
    <div>
      <div className="validity-bar">
        <div className="fill" style={{ width: animated + '%' }} />
        {status === 'active' && <>
          <div className="marker" style={{ left: animated + '%' }} />
          <div className="today" style={{ left: animated + '%' }}>Today · {Math.round(animated)}%</div>
        </>}
        {status === 'upcoming' && <div className="today" style={{ left: 0 }}>Starts {formatRelative(start)}</div>}
        {status === 'ended' && <div className="today" style={{ left: '100%', transform: 'translateX(-100%)' }}>Ended {formatRelative(end)}</div>}
      </div>
      <div className="validity-labels">
        <span>{formatDate(start)}</span>
        <span>{formatDate(end)}</span>
      </div>
    </div>
  );
}

/* ============================================================
 * Badge — small status pill
 * ============================================================ */
function Badge({ active, kind = 'status', children }) {
  if (kind === 'status') {
    return (
      <span className={'badge ' + (active ? 'active' : 'inactive')}>
        <span className="ind" />
        {children || (active ? 'Active' : 'Inactive')}
      </span>
    );
  }
  return <span className={'badge ' + kind}>{children}</span>;
}

/* ============================================================
 * Owner pill (with hashed avatar)
 * ============================================================ */
function OwnerPill({ owner }) {
  return (
    <div className="owner-pill">
      <span className="av" style={{ background: avatarGradient(owner.username) }}>
        {initial(owner.username)}
      </span>
      <span className="name">{owner.username}</span>
      <span className="role">{owner.role}</span>
      {!owner.active && (
        <span style={{ fontSize: 9, color: 'var(--err)', fontWeight: 700, letterSpacing: '0.05em' }}>OFF</span>
      )}
    </div>
  );
}

/* ============================================================
 * Toggle switch
 * ============================================================ */
function Toggle({ on, onChange, label }) {
  return (
    <div className={'toggle' + (on ? ' on' : '')} onClick={() => onChange(!on)}>
      <span className="track" />
      {label && <span className="label">{label}</span>}
    </div>
  );
}

/* ============================================================
 * Toast
 * ============================================================ */
function Toast({ message, onDone }) {
  useEffect(() => {
    if (!message) return;
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  return (
    <div className="toast">
      <span className="ok-icon"><Icon name="check" size={13} color="#fff" strokeWidth={3}/></span>
      {message}
    </div>
  );
}

/* ============================================================
 * LifecycleBar — horizontal stacked bar of lifecycle states.
 * `size` = "lg" (full breakdown) or "sm" (mini bar for inline use).
 * ============================================================ */
function LifecycleBar({ usage, size = 'lg' }) {
  const granted = usageGranted(usage);
  // animate fill on mount
  const [animIn, setAnimIn] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setAnimIn(true), 30);
    return () => clearTimeout(t);
  }, [granted]);

  if (granted === 0) {
    return (
      <div className={'lifecycle-bar empty ' + size}>
        <div className="lc-track" style={{ background: 'var(--g100)' }}/>
        {size === 'lg' && <div className="lc-empty-text">No grants yet on this bonus.</div>}
      </div>
    );
  }

  const segs = LIFECYCLE_STATES.map(state => {
    const amt = parseFloat(usage.states[state].amount) || 0;
    const pct = granted > 0 ? (amt / granted) * 100 : 0;
    return { state, amount: amt, count: usage.states[state].count, pct };
  });

  return (
    <div className={'lifecycle-bar ' + size}>
      <div className="lc-track">
        {segs.map(s => (
          s.pct > 0 ? (
            <div
              key={s.state}
              className="lc-seg"
              style={{
                width: animIn ? s.pct + '%' : 0,
                background: STATE_META[s.state].color,
              }}
              title={`${STATE_META[s.state].label} · ${s.count} · ${formatINRCompact(s.amount)}`}
            />
          ) : null
        ))}
      </div>
    </div>
  );
}

/* ============================================================
 * UsageBreakdown — granted total + LifecycleBar + chip row
 * Includes ALL / DAILY / WEEKLY / MONTHLY period tabs.
 * ============================================================ */
const USAGE_PERIODS = [
  { id: 'ALL',     label: 'All-time', factor: 1.0,   hint: 'lifetime' },
  { id: 'MONTHLY', label: 'Monthly',  factor: 0.42,  hint: 'last 30 days' },
  { id: 'WEEKLY',  label: 'Weekly',   factor: 0.12,  hint: 'last 7 days' },
  { id: 'DAILY',   label: 'Daily',    factor: 0.028, hint: 'last 24 hours' },
];

function scaleUsage(usage, factor) {
  if (!usage || factor === 1.0) return usage;
  const out = { states: {} };
  for (const s of LIFECYCLE_STATES) {
    const orig = usage.states[s] || { count: 0, amount: '0' };
    out.states[s] = {
      count: Math.round((orig.count || 0) * factor),
      amount: ((parseFloat(orig.amount) || 0) * factor).toFixed(2),
    };
  }
  return out;
}

function UsageBreakdown({ usage, dense = false }) {
  const [period, setPeriod] = useState('ALL');
  const cfg = USAGE_PERIODS.find(p => p.id === period) || USAGE_PERIODS[0];
  const scaled = scaleUsage(usage, cfg.factor);
  const granted = usageGranted(scaled);
  const fullGranted = usageGranted(usage);

  if (fullGranted === 0) {
    return (
      <div className="usage-empty">
        <Icon name="inbox" size={20} color="var(--g300)"/>
        <div>
          <div className="title">No grants yet</div>
          <div className="hint">Lifecycle counts will appear here once the bonus starts releasing.</div>
        </div>
      </div>
    );
  }
  return (
    <div className="usage-breakdown">
      <div className="usage-period-tabs" role="tablist" aria-label="Usage period">
        {USAGE_PERIODS.map(p => (
          <button
            key={p.id}
            type="button"
            role="tab"
            aria-selected={period === p.id}
            className={'usage-period-tab' + (period === p.id ? ' active' : '')}
            onClick={() => setPeriod(p.id)}
            title={p.hint}
          >
            {p.label}
          </button>
        ))}
        <span className="usage-period-hint">· {cfg.hint}</span>
      </div>
      {!dense && (
        <div className="usage-total">
          <div className="usage-total-num">{granted > 0 ? formatINRCompact(granted) : '—'}</div>
          <div className="usage-total-label">
            {granted > 0
              ? <>Granted across {summarizeCount(scaled)} grants <span style={{ color: 'var(--g400)' }}>· {cfg.label.toLowerCase()}</span></>
              : <>No grants in this period</>}
          </div>
        </div>
      )}
      <LifecycleBar usage={scaled} size={dense ? 'sm' : 'lg'}/>
      <div className={'usage-chips' + (dense ? ' dense' : '')}>
        {LIFECYCLE_STATES.map(s => {
          const v = scaled.states[s];
          return (
            <div key={s} className="usage-chip">
              <span className="dot" style={{ background: STATE_META[s].color }}/>
              <div className="kv">
                <div className="k">{STATE_META[s].label}</div>
                <div className="v">{formatINRCompact(v.amount)} <span className="ct">· {v.count}</span></div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
function summarizeCount(usage) {
  let n = 0;
  for (const s of LIFECYCLE_STATES) n += usage.states[s].count;
  return n.toLocaleString('en-IN');
}

Object.assign(window, {

/* KPI Strip — Selection · Active Promo Codes · Monthly Bonus */

function KpiStrip() {
  const heads = Object.values(MOCK_HEADS);

  // --- Active Promo Codes: count Heads, Subheads, and total codes ---
  let activeHeads = 0;
  let activeSubheads = 0;
  let activeCodes = 0;
  for (const h of heads) {
    if (h.active) activeHeads += 1;
    for (const sh of h.subheads) {
      const subDetail = MOCK_SUBHEADS[sh.id];
      if (!subDetail) continue;
      if (sh.active) activeSubheads += 1;
      for (const cfgId of subDetail.configures) {
        const cfg = MOCK_CONFIGURES[cfgId];
        if (!cfg) continue;
        for (const code of (cfg.codes || [])) {
          // Treat unspecified / 'active' codes as active
          if (!code.status || code.status === 'active' || code.active !== false) {
            activeCodes += 1;
          }
        }
      }
    }
  }

  // --- Monthly Bonus: aggregate MONTHLY budget across all heads ---
  let monthlyLimit = 0;
  let monthlyUsed = 0;
  for (const h of heads) {
    for (const b of (h.budget || [])) {
      if (b.period_type !== 'MONTHLY') continue;
      if (b.limit !== null) monthlyLimit += parseFloat(b.limit);
      monthlyUsed += parseFloat(b.used || '0');
    }
  }

  // Released = total bonus value granted to players this month (the "used" budget)
  const released = monthlyUsed;
  // Split released into outcomes — deterministic so the numbers stay stable across renders
  const consumed = released * 0.58;
  const pending  = released * 0.27;
  const forfeit  = released * 0.15;

  const pctOfLimit = monthlyLimit > 0 ? Math.min(100, (released / monthlyLimit) * 100) : 0;

  return (
    <div className="kpi-strip">

      {/* Cell 1: Total Active Promo Codes */}
      <div className="kpi-cell" style={{ animationDelay: '0ms' }}>

              <span className="kpi-pill-n">{activeHeads}</span>
              <span>Heads</span>
            </span>
            <span className="kpi-pill" title="Active Subheads">
              <span className="kpi-pill-icon"><Icon name="folder-tree" size={11} strokeWidth={2}/></span>
              <span className="kpi-pill-n">{activeSubheads}</span>
              <span>Subheads</span>
            </span>
          </div>
        </div>
      </div>

      {/* Cell 2: Total Monthly Bonus */}
      <div className="kpi-cell" style={{ animationDelay: '70ms' }}>
        <div className="kpi-eyebrow">
          <span className="kpi-eyebrow-icon"><Icon name="wallet" size={11} strokeWidth={2}/></span>
          Total Monthly Bonus
        </div>
        <div className="kpi-block">
          <div className="kpi-bonus-head">
            <div className="kpi-bonus-number">
              <CountUpCurrency value={released}/>
            </div>
            <div className="kpi-bonus-of">
              of {formatINRCompact(monthlyLimit)} budget · {Math.round(pctOfLimit)}%
            </div>
          </div>
          <div className="kpi-bonus-progress" aria-hidden="true">
            <div style={{ width: pctOfLimit + '%' }}/>
          </div>
          <div className="kpi-breakdown">
            <div className="kpi-stat released">
              <div className="kpi-stat-top">
                <span className="kpi-stat-dot"/>
                Released
              </div>
              <div className="kpi-stat-value">{formatINRCompact(released)}</div>
              <div className="kpi-stat-sub">100%</div>
            </div>
            <div className="kpi-stat consumed">
              <div className="kpi-stat-top">
                <span className="kpi-stat-dot"/>
                Consumed
              </div>
              <div className="kpi-stat-value">{formatINRCompact(consumed)}</div>
              <div className="kpi-stat-sub">{Math.round((consumed / released) * 100)}%</div>
            </div>
            <div className="kpi-stat pending">
              <div className="kpi-stat-top">
                <span className="kpi-stat-dot"/>
                Pending
              </div>
              <div className="kpi-stat-value">{formatINRCompact(pending)}</div>
              <div className="kpi-stat-sub">{Math.round((pending / released) * 100)}%</div>
            </div>
            <div className="kpi-stat forfeit">

                <span className="kpi-stat-dot"/>
                Forfeit
              </div>
              <div className="kpi-stat-value">{formatINRCompact(forfeit)}</div>

            </div>

}

function ContextMenu({ x, y, items, onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    function handle(e) {
      if (!ref.current) return;
      if (!ref.current.contains(e.target)) onClose();
    }
    document.addEventListener('mousedown', handle);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') onClose(); });
    return () => document.removeEventListener('mousedown', handle);
  }, []);
  // Smart positioning: keep on screen
  const W = 200, H = 6 + items.length * 36 + 4;
  const left = Math.max(8, Math.min(window.innerWidth - W - 8, x));
  const top = Math.max(8, Math.min(window.innerHeight - H - 8, y));
  return (
    <div ref={ref} className="ctx-menu" style={{ left, top, minWidth: W }} role="menu">
      {items.map((it, i) => it.sep ? (
        <div key={i} className="sep" />
      ) : (
        <div
          key={i}
          className={'item' + (it.danger ? ' danger' : '')}
          onClick={() => { it.onClick && it.onClick(); onClose(); }}
          role="menuitem"
        >
          <Icon name={it.icon} size={14} />
          <span style={{ flex: 1 }}>{it.label}</span>
          {it.shortcut && (
            <span style={{ fontSize: 10, color: 'var(--g400)', fontFamily: 'var(--mono)' }}>{it.shortcut}</span>
          )}
        </div>
      ))}
    </div>
  );
}

/* ---------- Segments Modal — browse all + search + create new ---------- */
function SegmentsModal({ initialMode, onClose, onOpenSegment }) {
  const [mode, setMode] = useState(initialMode); // 'browse' | 'create'
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('RECENT'); // RECENT | NAME | SIZE
  const segs = (typeof MANUAL_SEGMENTS !== 'undefined') ? MANUAL_SEGMENTS : [];

  useEffect(() => {
    function handle(e) { if (e.key === 'Escape') onClose(); }
    document.addEventListener('keydown', handle);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', handle);
      document.body.style.overflow = '';
    };
  }, [onClose]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    let list = segs.filter(s =>
      !q || s.label.toLowerCase().includes(q) || s.hint.toLowerCase().includes(q) || s.owner.toLowerCase().includes(q)
    );
    if (sortBy === 'RECENT')      list = [...list].sort((a, b) => new Date(b.last_used_at) - new Date(a.last_used_at));
    else if (sortBy === 'NAME')   list = [...list].sort((a, b) => a.label.localeCompare(b.label));
    else if (sortBy === 'SIZE')   list = [...list].sort((a, b) => b.count - a.count);
    return list;
  }, [search, sortBy, segs]);

  return (
    <div className="modal-overlay" onClick={onClose} role="dialog" aria-modal="true">
      <div className="modal seg-modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <span className="modal-icon"><Icon name="users" size={16}/></span>
          <div className="modal-title-block">
            <span className="modal-title">Player Segments</span>
            <span className="modal-subtitle">
              {mode === 'browse' ? `${segs.length} segments · browse & search` : 'Build a new segment with filters'}
            </span>
          </div>
          <div className="modal-tabs">
            <button
              className={'modal-tab' + (mode === 'browse' ? ' active' : '')}
              onClick={() => setMode('browse')}
              type="button"
            >
              <Icon name="list" size={12}/> Browse
            </button>
            <button
              className={'modal-tab' + (mode === 'create' ? ' active' : '')}
              onClick={() => setMode('create')}
              type="button"
            >
              <Icon name="plus-circle" size={12}/> Create
            </button>
          </div>
          <button className="close" onClick={onClose} aria-label="Close">
            <Icon name="x" size={18}/>
          </button>
        </div>
        {mode === 'browse'
          ? <SegmentsBrowse list={filtered} search={search} setSearch={setSearch} sortBy={sortBy} setSortBy={setSortBy} onCreate={() => setMode('create')} onPick={onOpenSegment}/>
          : <SegmentBuilder onCancel={() => setMode('browse')} onSave={onClose}/>}
      </div>
    </div>
  );
}

function SegmentsBrowse({ list, search, setSearch, sortBy, setSortBy, onCreate, onPick }) {
  return (
    <>
      <div className="modal-toolbar">
        <div className="modal-search">
          <Icon name="search" size={13} color="var(--g400)"/>

function highlight(text, q) {
  if (!q || !q.trim()) return text;
  const i = text.toLowerCase().indexOf(q.trim().toLowerCase());
  if (i < 0) return text;
  return <>{text.slice(0, i)}<mark>{text.slice(i, i + q.trim().length)}</mark>{text.slice(i + q.trim().length)}</>;
}

/* ---------- Segment Builder — multi-filter rule editor ---------- */
function SegmentBuilder({ onCancel, onSave }) {
  const [name, setName] = useState('');
  const [description, setDescription] = useState('');
  const [combinator, setCombinator] = useState('AND');
  const [rules, setRules] = useState([
    { id: 1, field: 'kyc_status', op: 'IS', value: 'VERIFIED' },
    { id: 2, field: 'last_login', op: 'WITHIN', value: '7', unit: 'days' },
  ]);
  const [nextId, setNextId] = useState(3);

  const updateRule = (id, patch) => setRules(rs => rs.map(r => r.id === id ? { ...r, ...patch } : r));
  const removeRule = (id) => setRules(rs => rs.filter(r => r.id !== id));
  const addRule = () => {
    setRules(rs => [...rs, { id: nextId, field: 'tier', op: 'IS', value: 'Gold' }]);
    setNextId(n => n + 1);
  };

  // Deterministic "preview" count derived from rules (mock)
  const estimate = useMemo(() => {
    if (rules.length === 0) return 0;
    let base = 24800; // total active player base
    rules.forEach((r, i) => {
      // very rough heuristic: each rule narrows the pool
      const factor = 0.45 + ((r.id * 7) % 30) / 100;
      base = Math.floor(base * factor);
    });
    if (combinator === 'OR') base = Math.min(24800, base * Math.max(1, rules.length));
    return Math.max(12, base);
  }, [rules, combinator]);

  const canSave = name.trim().length >= 2 && rules.length > 0;

  return (
    <>
      <div className="modal-body seg-builder-body">
        <div className="builder-row builder-meta">
          <div className="field-group" style={{ flex: 1, marginBottom: 0 }}>
            <label>Segment name</label>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. High LTV — Maharashtra, no recent bonus"/>
          </div>
          <div className="field-group" style={{ flex: 1, marginBottom: 0 }}>
            <label>Description <span style={{ color: 'var(--g400)', fontWeight: 400 }}>· optional</span></label>
            <input value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What is this segment for?"/>
          </div>
        </div>

        <div className="builder-section">
          <div className="builder-section-head">
            <span className="section-label" style={{ margin: 0 }}>Filters</span>
            <div className="builder-combinator">
              <span style={{ fontSize: 11.5, color: 'var(--g500)' }}>Match</span>
              <div className="seg" style={{ '--cols': 2, padding: 3, width: 132 }}>
                <button type="button" className={combinator === 'AND' ? 'active' : ''} onClick={() => setCombinator('AND')}>ALL (AND)</button>
                <button type="button" className={combinator === 'OR' ? 'active' : ''} onClick={() => setCombinator('OR')}>ANY (OR)</button>
              </div>
            </div>
          </div>

          <div className="builder-rules">
            {rules.length === 0 && (
              <div className="builder-empty">No filters yet — add one to narrow the audience.</div>
            )}
            {rules.map((r, i) => (
              <React.Fragment key={r.id}>
                {i > 0 && <div className="builder-join">{combinator}</div>}
                <RuleEditor rule={r} onChange={(patch) => updateRule(r.id, patch)} onRemove={() => removeRule(r.id)}/>
              </React.Fragment>
            ))}
          </div>

          <button className="builder-add" type="button" onClick={addRule}>
            <Icon name="plus" size={12}/> Add filter
          </button>
        </div>

        <div className="builder-preview">
          <div className="builder-preview-num">{estimate.toLocaleString('en-IN')}</div>
          <div className="builder-preview-meta">
            <span className="k">Estimated reach</span>
            <span className="v">~{Math.round((estimate / 24800) * 100)}% of active players · {rules.length} filter{rules.length === 1 ? '' : 's'} ({combinator})</span>
          </div>
          <button className="builder-refresh" type="button" title="Recompute">
            <Icon name="refresh-cw" size={12}/> Preview
          </button>
        </div>
      </div>

      <div className="modal-footer-row builder-footer">
        <button className="btn btn-ghost btn-sm" type="button" onClick={onCancel}>
          <Icon name="arrow-left" size={12}/> Back to browse
        </button>
        <div style={{ flex: 1 }}/>
        <button className="btn btn-secondary btn-sm" type="button" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary btn-sm" type="button" disabled={!canSave} onClick={onSave}>
          <Icon name="check" size={12}/> Save segment
        </button>
      </div>
    </>
  );
}

function RuleEditor({ rule, onChange, onRemove }) {
  const field = SEGMENT_FIELDS.find(f => f.id === rule.field) || SEGMENT_FIELDS[0];
  const ops = OPS[field.type] || OPS.enum;
  const op = ops.find(o => o.id === rule.op) || ops[0];

  // When field changes, reset op + value to first valid
  const onFieldChange = (id) => {
    const f = SEGMENT_FIELDS.find(x => x.id === id);
    const firstOp = (OPS[f.type] || OPS.enum)[0];
    let value = '';
    if (f.type === 'enum') value = f.options[0];
    if (f.type === 'recency') value = '7';
    onChange({ field: id, op: firstOp.id, value });
  };

  return (
    <div className="builder-rule">
      <select className="rule-field" value={rule.field} onChange={(e) => onFieldChange(e.target.value)}>
        {SEGMENT_FIELDS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
      </select>
      <select className="rule-op" value={rule.op} onChange={(e) => onChange({ op: e.target.value })}>
        {ops.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
      </select>

      {field.type === 'enum' && (op.id === 'IN' || op.id === 'NOT_IN') ? (
        <MultiSelect
          options={field.options}
          value={Array.isArray(rule.value) ? rule.value : (rule.value ? [rule.value] : [])}
          onChange={(v) => onChange({ value: v })}
        />
      ) : field.type === 'enum' ? (
        <select className="rule-value" value={rule.value} onChange={(e) => onChange({ value: e.target.value })}>
          {field.options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      ) : field.type === 'recency' ? (
        <div className="rule-recency">
          <input
            className="rule-value rule-num"
            type="number"
            min="1"
            value={rule.value || ''}
            onChange={(e) => onChange({ value: e.target.value })}
          />
          <select
            className="rule-unit"
            value={rule.unit || 'days'}
            onChange={(e) => onChange({ unit: e.target.value })}
          >
            <option value="days">days</option>
            <option value="weeks">weeks</option>
            <option value="months">months</option>
          </select>
        </div>
      ) : (op.id === 'BETWEEN') ? (
        <div className="rule-recency">
          <input
            className="rule-value rule-num"
            value={rule.value || ''}
            onChange={(e) => onChange({ value: e.target.value })}
            placeholder="min"
          />
          <span style={{ color: 'var(--g400)', fontSize: 12 }}>and</span>
          <input
            className="rule-value rule-num"
            value={rule.value2 || ''}
            onChange={(e) => onChange({ value2: e.target.value })}
            placeholder="max"
          />
        </div>
      ) : (
        <input
          className="rule-value"
          value={rule.value || ''}
          onChange={(e) => onChange({ value: e.target.value })}
          placeholder={field.type === 'amount' ? '₹ amount' : 'value'}
        />
      )}

      <button className="rule-remove" type="button" onClick={onRemove} aria-label="Remove filter">
        <Icon name="x" size={13}/>
      </button>
    </div>
  );
}

function MultiSelect({ options, value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    function handle(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handle);
    return () => document.removeEventListener('mousedown', handle);
  }, [open]);
  const toggle = (o) => {
    const has = value.includes(o);
    onChange(has ? value.filter(x => x !== o) : [...value, o]);
  };
  const summary = value.length === 0 ? 'Select…' : value.length === 1 ? value[0] : `${value.length} selected`;
  return (
    <div className="rule-multi" ref={ref}>
      <button type="button" className="rule-multi-trigger" onClick={() => setOpen(o => !o)}>
        <span style={{ flex: 1, textAlign: 'left', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{summary}</span>
        <Icon name="chevron-down" size={12} color="var(--g400)"/>
      </button>
      {open && (
        <div className="rule-multi-menu">
          {options.map(o => (
            <label key={o} className={'rule-multi-item' + (value.includes(o) ? ' on' : '')}>
              <input type="checkbox" checked={value.includes(o)} onChange={() => toggle(o)}/>
              <span>{o}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function BudgetGrid({ budget }) {
  if (!budget || budget.length === 0) {
    return (
      <div style={{ padding: 20, border: '1px dashed var(--g200)', borderRadius: 'var(--rl)', textAlign: 'center', fontSize: 12, color: 'var(--g400)' }}>

  }
  // Order: DAILY, WEEKLY, MONTHLY
  const order = { DAILY: 0, WEEKLY: 1, MONTHLY: 2 };
  const sorted = [...budget].sort((a, b) => (order[a.period_type] ?? 9) - (order[b.period_type] ?? 9));
  return (
    <div className="ring-grid">

  );

/* ============================================================
 * HistoryDrawer — left-side slide-out showing change history
 * ============================================================ */
function HistoryDrawer({ state, onClose }) {
  const open = !!state;
  useEffect(() => {
    if (!open) return;
    function handle(e) { if (e.key === 'Escape') onClose(); }
    document.addEventListener('keydown', handle);
    return () => document.removeEventListener('keydown', handle);
  }, [open, onClose]);

  const meta = state && nodeNameFor(state);
  return (
    <>
      <div className={'drawer-overlay' + (open ? ' open' : '')} onClick={onClose} aria-hidden={!open}/>
      <div className={'drawer' + (open ? ' open' : '')} role="dialog" aria-modal="true" aria-label="Change history">
        {state && (
          <>
            <div className="drawer-header">
              <span className="icon"><Icon name="history" size={16}/></span>
              <div className="title-block">
                <div className="title">Change History</div>
                <div className="subtitle">{meta.kind} · {meta.name}</div>
              </div>
              <button className="close" onClick={onClose} aria-label="Close drawer">
                <Icon name="x" size={18}/>
              </button>
            </div>
            <div className="drawer-body history-body">
              <ChangeHistory type={state.type} id={state.id} alwaysExpanded/>
            </div>
          </>
        )}
      </div>
    </>
  );
}

function nodeNameFor({ type, id }) {
  if (type === 'head')      return { kind: 'Head',      name: MOCK_HEADS[id]?.name || '—' };
  if (type === 'subhead')   return { kind: 'Subhead',   name: MOCK_SUBHEADS[id]?.name || '—' };
  if (type === 'configure') return { kind: 'Configure', name: MOCK_CONFIGURES[id]?.name || '—' };
  return { kind: 'Node', name: '—' };
}

/* ============================================================
 * ChangeHistory — timeline of audit events for a configure
 * ============================================================ */
function ChangeHistory({ type = 'configure', id, alwaysExpanded = false }) {
  const all = getHistory(type, id);
  const [expanded, setExpanded] = useState(alwaysExpanded);
  if (all.length === 0) {
    return (
      <div className="history-empty">
        <Icon name="history" size={14} color="var(--g400)"/>
        <span>No changes recorded yet.</span>
      </div>
    );
  }
  const shown = (alwaysExpanded || expanded) ? all : all.slice(0, 4);
  return (
    <div className="history-card">
      <div className="history-list">
        {shown.map((evt, i) => <HistoryRow key={i} evt={evt} last={i === shown.length - 1}/>)}
      </div>
      {!alwaysExpanded && all.length > 4 && (
        <button
          className="history-toggle"
          onClick={() => setExpanded(e => !e)}
        >
          {expanded
            ? <><Icon name="chevron-up" size={12}/> Show recent only</>
            : <><Icon name="chevron-down" size={12}/> Show all {all.length} events</>}
        </button>
      )}
    </div>
  );
}

function _strHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function _seedRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = Math.imul(s ^ (s >>> 15), 1 | s);
    s ^= s + Math.imul(s ^ (s >>> 7), 61 | s);
    return ((s ^ (s >>> 14)) >>> 0) / 4294967296;
  };
}
function makePlayer(segmentId, index) {
  const r = _seedRng(_strHash(segmentId + ':' + index));
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const fn = pick(PLAYER_FIRST_NAMES);
  const ln = pick(PLAYER_LAST_NAMES);
  const id = 10000 + Math.floor(r() * 89999);
  const name = `${fn} ${ln}`;
  const email = `${fn.toLowerCase()}.${ln.toLowerCase()}${Math.floor(r() * 99)}@wynta.in`;
  const state = pick(PLAYER_STATES);
  const tier = pick(PLAYER_TIERS);
  const kyc = pick(PLAYER_KYC);
  const lifetimeDep = Math.floor((r() * 200000 + 1000) / 100) * 100;
  const lifetimeWager = Math.round(lifetimeDep * (3 + r() * 8));
  const lifetimeGgr = Math.round(lifetimeWager * (0.03 + r() * 0.07));
  const totalBonuses = Math.floor(r() * 28);
  const sessions7 = Math.floor(r() * 28);
  const daysAgoReg = Math.floor(r() * 720) + 1;
  const daysAgoLogin = Math.floor(r() * 30);
  const product = pick(PLAYER_PRODUCTS);
  const phone = '+91 ' + (60000 + Math.floor(r() * 39999)) + ' ' + (10000 + Math.floor(r() * 89999));
  return {
    id, name, email, phone, state, country: 'India',
    tier, kyc, lifetimeDep, lifetimeWager, lifetimeGgr,
    totalBonuses, sessions7, daysAgoReg, daysAgoLogin, product,
  };
}

/* Build a player whose id is the supplied numeric id — used by global search-by-ID */
function makePlayerById(id) {
  const r = _seedRng(_strHash('pid:' + id));
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const fn = pick(PLAYER_FIRST_NAMES);

  const lifetimeWager = Math.round(lifetimeDep * (3 + r() * 8));
  return {
    id,
    name,
    email,
    phone: '+91 ' + (60000 + Math.floor(r() * 39999)) + ' ' + (10000 + Math.floor(r() * 89999)),
    state: pick(PLAYER_STATES),
    country: 'India',
    tier: pick(PLAYER_TIERS),
    kyc: pick(PLAYER_KYC),
    lifetimeDep,
    lifetimeWager,
    lifetimeGgr: Math.round(lifetimeWager * (0.03 + r() * 0.07)),
    totalBonuses: Math.floor(r() * 28),
    sessions7: Math.floor(r() * 28),
    daysAgoReg: Math.floor(r() * 720) + 1,
    daysAgoLogin: Math.floor(r() * 30),
    product: pick(PLAYER_PRODUCTS),
  };
}

/* Global pool of players for name/email search — built lazily, capped */
let _GLOBAL_PLAYER_POOL = null;
function getGlobalPlayerPool() {
  if (_GLOBAL_PLAYER_POOL) return _GLOBAL_PLAYER_POOL;
  const segs = (typeof MANUAL_SEGMENTS !== 'undefined') ? MANUAL_SEGMENTS : [];
  const pool = [];
  const seen = new Set();
  // Take up to 80 players from each segment (capped total ~1500)
  for (const s of segs) {
    const take = Math.min(80, s.count);
    for (let i = 0; i < take; i++) {
      const p = makePlayer(s.id, i);
      if (!seen.has(p.id)) { seen.add(p.id); pool.push(p); if (pool.length >= 1500) break; }
    }
    if (pool.length >= 1500) break;
  }
  _GLOBAL_PLAYER_POOL = pool;
  return pool;
}
function _initials(name) { return name.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase(); }
function _tierClass(t) { return 'tier-' + t.toLowerCase().replace(/\s+/g, '-'); }
function _kycClass(k) { return 'kyc-' + k.toLowerCase(); }

/* ---------- Pager — first / window / last with prev/next ---------- */
function Pager({ page, totalPages, onChange }) {
  if (totalPages <= 1) return null;
  const items = [];
  const win = 1;
  items.push(1);
  if (page - win > 2) items.push('…');
  for (let i = Math.max(2, page - win); i <= Math.min(totalPages - 1, page + win); i++) items.push(i);
  if (page + win < totalPages - 1) items.push('…');
  if (totalPages > 1) items.push(totalPages);
  return (
    <div className="pager-controls">
      <button className="pager-btn" onClick={() => onChange(page - 1)} disabled={page === 1}>
        <Icon name="chevron-left" size={11}/>
      </button>
      {items.map((p, i) => p === '…' ? (
        <span key={'e' + i} className="pager-ellipsis">…</span>
      ) : (
        <button key={p} className={'pager-btn' + (p === page ? ' active' : '')} onClick={() => onChange(p)}>{p}</button>
      ))}
      <button className="pager-btn" onClick={() => onChange(page + 1)} disabled={page === totalPages}>
        <Icon name="chevron-right" size={11}/>
      </button>
    </div>
  );
}

/* ---------- Players list — search + pagination, click → profile ---------- */
const PLAYERS_PAGE_SIZE = 10;
const PLAYERS_SEARCH_CAP = 1000;

function SegmentPlayersList({ segment, onPickPlayer }) {
  const [query, setQuery] = useState('');
  const [page, setPage] = useState(1);
  const total = segment.count;

  // Search pool — capped so search across 18k+ players stays snappy.
  const searchPool = useMemo(() => {
    if (!query) return null;
    const cap = Math.min(total, PLAYERS_SEARCH_CAP);
    const out = [];
    for (let i = 0; i < cap; i++) out.push(makePlayer(segment.id, i));
    return out;
  }, [segment.id, query ? '_' : '']); // build once per segment

  useEffect(() => { setPage(1); }, [segment.id, query]);

  const q = query.trim().toLowerCase();
  let slice, filteredTotal, pageTotal, scopeNote;
  if (q && searchPool) {
    const matches = searchPool.filter(p =>
      p.name.toLowerCase().includes(q) ||
      String(p.id).includes(q) ||
      p.email.toLowerCase().includes(q)
    );
    filteredTotal = matches.length;
    pageTotal = Math.max(1, Math.ceil(filteredTotal / PLAYERS_PAGE_SIZE));
    const safe = Math.min(page, pageTotal);
    slice = matches.slice((safe - 1) * PLAYERS_PAGE_SIZE, safe * PLAYERS_PAGE_SIZE);
    scopeNote = total > PLAYERS_SEARCH_CAP ? ` · searched first ${PLAYERS_SEARCH_CAP.toLocaleString('en-IN')} of ${total.toLocaleString('en-IN')}` : '';
  } else {
    filteredTotal = total;
    pageTotal = Math.max(1, Math.ceil(total / PLAYERS_PAGE_SIZE));
    const safe = Math.min(page, pageTotal);
    const startIdx = (safe - 1) * PLAYERS_PAGE_SIZE;
    const endIdx = Math.min(startIdx + PLAYERS_PAGE_SIZE, total);
    slice = [];
    for (let i = startIdx; i < endIdx; i++) slice.push(makePlayer(segment.id, i));
    scopeNote = '';
  }

  const safePage = Math.min(page, pageTotal);
  const startIdx = (safePage - 1) * PLAYERS_PAGE_SIZE;
  const endIdx = Math.min(startIdx + slice.length, filteredTotal);

  return (
    <div className="seg-players">
      <div className="seg-players-toolbar">
        <div className="seg-players-search">
          <Icon name="search" size={13} color="var(--g400)"/>
          <input
            type="text"
            placeholder="Search players by name, ID, or email…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
          {query && (
            <button className="modal-search-clear" onClick={() => setQuery('')} title="Clear">
              <Icon name="x" size={11}/>
            </button>
          )}
        </div>
        <div className="meta">
          {q
            ? `${filteredTotal.toLocaleString('en-IN')} match${filteredTotal === 1 ? '' : 'es'}${scopeNote}`
            : `${total.toLocaleString('en-IN')} players in segment`}
        </div>
      </div>

      <div className="seg-players-thead">
        <span></span>
        <span>Player</span>
        <span>ID</span>
        <span>State</span>
        <span>Tier</span>
        <span>KYC</span>
        <span style={{ textAlign: 'right' }}>Lifetime Dep.</span>
        <span style={{ textAlign: 'right' }}>Last Seen</span>
      </div>

      {slice.length === 0 ? (
        <div className="seg-players-empty">No players match “{query}”</div>
      ) : slice.map(p => (
        <div key={p.id} className="seg-players-row" onClick={() => onPickPlayer(p)}>
          <span className="avatar">{_initials(p.name)}</span>
          <div className="ident">
            <div className="name">{p.name}</div>
            <div className="email">{p.email}</div>
          </div>
          <span className="pid">#{p.id}</span>
          <span className="state">{p.state}</span>
          <span className={'tier-badge ' + _tierClass(p.tier)}>{p.tier}</span>
          <span className={'kyc-badge ' + _kycClass(p.kyc)}>{p.kyc}</span>
          <span className="num" style={{ textAlign: 'right' }}>{formatINRCompact(p.lifetimeDep)}</span>
          <span className="last-login" style={{ textAlign: 'right' }}>
            {p.daysAgoLogin === 0 ? 'today' : p.daysAgoLogin + 'd ago'}
          </span>
        </div>
      ))}

      {pageTotal > 1 && (
        <div className="seg-players-pager">
          <div className="pager-info">
            {filteredTotal === 0
              ? 'No results'
              : `Showing ${(startIdx + 1).toLocaleString('en-IN')}–${endIdx.toLocaleString('en-IN')} of ${filteredTotal.toLocaleString('en-IN')}`}
          </div>
          <Pager page={safePage} totalPages={pageTotal} onChange={setPage}/>
        </div>
      )}
    </div>
  );
}

function PlayerProfileModal({ player, segment, onClose }) {
  const bonuses = useMemo(() => {
    if (!player) return [];

    const count = 3 + Math.floor(r() * 4);
    const names = ['Welcome Bonus','Weekly Reload','Friday Drop','VIP Cashback','Birthday Drop','Refer & Earn','Tier Milestone'];
    const statuses = ['RELEASED','RELEASED','PENDING','EXPIRED','CONSUMED'];
    const out = [];
    for (let i = 0; i < count; i++) {
      out.push({
        id: i + 1,
        name: names[Math.floor(r() * names.length)],
        amount: Math.floor(r() * 9000 + 100),
        status: statuses[Math.floor(r() * statuses.length)],
        daysAgo: Math.floor(r() * 60) + 1,
      });
    }
    return out;
  }, [player && player.id]);

  // Esc to close
  useEffect(() => {
    if (!player) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);

  if (!player) return null;

  return ReactDOM.createPortal(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 760 }} onClick={(e) => e.stopPropagation()}>

                <div className="sub">

            <div className="player-stats">

function PlayerSegmentPicker({ configureId }) {
  const segs = (typeof MANUAL_SEGMENTS !== 'undefined') ? MANUAL_SEGMENTS : [];
  // Deterministic default segment per configure so each panel looks meaningfully filled.
  const defaultId = segs.length ? segs[configureId % segs.length].id : null;
  const [segmentId, setSegmentId] = useState(defaultId);
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const popRef = useRef(null);

  // Reset selection when navigating between configures
  useEffect(() => { setSegmentId(defaultId); setOpen(false); }, [configureId]); // eslint-disable-line

  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (popRef.current && !popRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);

  const selected = segs.find(s => s.id === segmentId) || null;
  const q = query.trim().toLowerCase();
  const filtered = q
    ? segs.filter(s => s.label.toLowerCase().includes(q) || (s.hint || '').toLowerCase().includes(q))
    : segs;

  return (
    <div className="seg-picker" ref={popRef}>
      {selected ? (
        <div
          className="seg-picker-card"
          role="button"
          tabIndex={0}
          onClick={() => setOpen(o => !o)}
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(o => !o); } }}
        >
          <span className="seg-mark"><Icon name="users" size={16}/></span>
          <div className="seg-info">
            <div className="seg-label">{selected.label}</div>
            <div className="seg-meta">
              <span className="seg-count"><strong>{selected.count.toLocaleString('en-IN')}</strong> players</span>
              <span style={{ color: 'var(--g300)' }}>·</span>
              <span>{selected.hint}</span>
            </div>
          </div>
          <div className="seg-actions" onClick={(e) => e.stopPropagation()}>
            <button className="btn btn-secondary btn-sm" onClick={() => setOpen(o => !o)}>
              <Icon name="repeat" size={12}/> Change
            </button>
            <button className="btn btn-secondary btn-sm btn-icon-only" title="Remove segment" onClick={() => { setSegmentId(null); setOpen(false); }}>
              <Icon name="x" size={13}/>
            </button>
          </div>
        </div>
      ) : (
        <div className="seg-picker-empty">
          <div className="seg-empty-text">
            <strong>No player segment selected.</strong> Bonus is available to all players for this configure.
          </div>
          <button className="btn btn-primary btn-sm" onClick={() => setOpen(o => !o)}>
            <Icon name="users" size={12}/> Select Player Segment
          </button>
        </div>
      )}

      {open && (
        <div className="seg-picker-pop">
          <div className="pop-search">
            <input
              autoFocus
              type="text"
              placeholder="Search segments…"
              value={query}
              onChange={e => setQuery(e.target.value)}
            />
          </div>
          <div className="pop-list">
            {filtered.length === 0 ? (
              <div className="pop-empty">No segments match “{query}”</div>
            ) : filtered.map(s => (
              <div
                key={s.id}
                className={'pop-item' + (s.id === segmentId ? ' selected' : '')}
                onClick={() => { setSegmentId(s.id); setOpen(false); setQuery(''); }}
              >
                <Icon name="users" size={12} color={s.id === segmentId ? 'var(--blue)' : 'var(--g400)'}/>
                <div className="pop-label">{s.label}</div>
                <div className="pop-count">{s.count.toLocaleString('en-IN')}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
 * Detail panel — switches on selected type
 * ============================================================ */
function DetailPanel({ selectedNode, onSelect, onAction }) {
  if (!selectedNode) return <EmptyState/>;
  if (selectedNode.type === 'head') {
    const head = MOCK_HEADS[selectedNode.id];
    if (!head) return <EmptyState/>;
    return <HeadDetailPanel head={head} onSelect={onSelect} onAction={onAction}/>;
  }
  if (selectedNode.type === 'subhead') {
    const sub = MOCK_SUBHEADS[selectedNode.id];
    if (!sub) return <EmptyState/>;
    return <SubheadDetailPanel subhead={sub} onSelect={onSelect} onAction={onAction}/>;
  }
  if (selectedNode.type === 'configure') {
    const cfg = MOCK_CONFIGURES[selectedNode.id];
    if (!cfg) return <EmptyState/>;
    return <ConfigureDetailPanel configure={cfg} onSelect={onSelect} onAction={onAction}/>;
  }
  return <EmptyState/>;
}

function SlideDrawer({ state, onClose, onSubmit }) {
  const [submitting, setSubmitting] = useState(false);
  const open = !!state;
  const cfg = state && DRAWER_TITLES[state.type];

  // Reset submitting when state changes
  useEffect(() => { setSubmitting(false); }, [state]);

  const doSubmit = (data) => {
    setSubmitting(true);
    setTimeout(() => {
      setSubmitting(false);
      onSubmit(data);
    }, 600);
  };

  // Lock body scroll when open
  useEffect(() => {
    if (open) document.body.style.overflow = 'hidden';
    else document.body.style.overflow = '';
    return () => { document.body.style.overflow = ''; };
  }, [open]);

  return (
    <>
      <div className={'drawer-overlay' + (open ? ' open' : '')} onClick={onClose} aria-hidden={!open}/>
      <div className={'drawer' + (open ? ' open' : '')} role="dialog" aria-modal="true" aria-label={cfg ? cfg.title : ''}>
        {state && (
          <>
            <div className="drawer-header">
              <span className="icon"><Icon name={cfg.icon} size={16}/></span>
              <span className="title">{cfg.title}</span>
              <button className="close" onClick={onClose} aria-label="Close drawer">
                <Icon name="x" size={18}/>
              </button>
            </div>
            <DrawerForm state={state} submitting={submitting} onCancel={onClose} onSubmit={doSubmit}/>
          </>
        )}
      </div>
    </>
  );
}

function ManualBonusForm({ state, submitting, onCancel, onSubmit }) {
  const cfg = MOCK_CONFIGURES[state.parentId] || MOCK_CONFIGURES[261];

  const today = new Date();
  const stamp = today.getFullYear().toString().slice(2)
    + String(today.getMonth() + 1).padStart(2, '0')
    + String(today.getDate()).padStart(2, '0');

  const [campaign, setCampaign]   = useState('');
  const [code, setCode]           = useState('MB_' + stamp);
  const [amount, setAmount]       = useState('500');
  const [validDays, setValidDays] = useState(14);
  const [mode, setMode]           = useState('SEGMENT');
  const [segmentId, setSegmentId] = useState('VIP_T3');
  const [idsText, setIdsText]     = useState('');
  const [autoApply, setAutoApply] = useState(false);
  const [note, setNote]           = useState('');

  // Parse uploaded IDs (paste or file). Accepts newlines/commas; optional ",amount" per line.
  const parsedRows = useMemo(() => {
    if (!idsText.trim()) return [];
    return idsText.split(/\r?\n/)
      .map(line => {
        const t = line.trim();
        if (!t || t.startsWith('#')) return null;
        const parts = t.split(/[,\t;]\s*/);
        const pid = parts[0]?.trim();
        if (!pid) return null;
        const amt = parts[1] ? parseFloat(parts[1]) : null;
        return { pid, amt: isNaN(amt) ? null : amt };
      })
      .filter(Boolean);
  }, [idsText]);

  const handleFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => setIdsText(String(ev.target.result || ''));
    reader.readAsText(f);
  };

  const seg = MANUAL_SEGMENTS.find(s => s.id === segmentId);
  const reach = mode === 'SEGMENT' ? (seg?.count || 0) : parsedRows.length;
  const perPlayer = parseFloat(amount) || 0;
  const totalCost = parsedRows.length && mode === 'UPLOAD' && parsedRows.some(r => r.amt !== null)
    ? parsedRows.reduce((acc, r) => acc + (r.amt !== null ? r.amt : perPlayer), 0)
    : reach * perPlayer;

  const handle = (e) => {
    e.preventDefault();
    onSubmit({
      type: 'NEW_MANUAL_BONUS',
      campaign, code, amount, validDays, mode,
      segment: mode === 'SEGMENT' ? seg : null,
      ids: mode === 'UPLOAD' ? parsedRows : null,
      autoApply, note, reach, totalCost,
    });
  };

  return (
    <form onSubmit={handle} style={{ display: 'contents' }}>
      <div className="drawer-body">
        {cfg && (
          <div className="field-group">
            <label>Under</label>
            <span className="parent-chip"><Icon name="folder-tree" size={11}/> Manual Bonus</span>
            <div className="helper" style={{ marginTop: 4 }}>
              Each issue creates a fresh promo code under <strong style={{ color: 'var(--g700)' }}>{cfg.name}</strong>.
            </div>
          </div>
        )}

        <div className="field-group">
          <label>Campaign name <span style={{ color: 'var(--g400)', fontWeight: 400 }}>· optional</span></label>
          <input value={campaign} onChange={(e) => setCampaign(e.target.value)} placeholder="e.g. May VIP Loyalty Thank-You"/>
        </div>

        <div className="field-group">
          <label>Promo code</label>
          <input
            value={code}
            onChange={(e) => setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9_]/g, ''))}
            placeholder="MB_XXXXX"
            style={{ fontFamily: 'var(--mono)', fontWeight: 600, letterSpacing: '0.04em' }}
            maxLength={32}
          />
          <div className="helper">Uppercase letters, digits, underscore.</div>
        </div>

        <div className="field-group">
          <div className="row-2">
            <div>
              <label>Bonus amount per player (₹)</label>
              <input value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="500"/>
            </div>
            <div>
              <label>Valid for (days)</label>
              <input type="number" min="1" max="365" value={validDays} onChange={(e) => setValidDays(parseInt(e.target.value || '0'))}/>
            </div>
          </div>
        </div>

        <div className="section-divider"/>
        <div className="section-divider-label">Audience</div>

        <div className="field-group">
          <div className="seg" style={{ '--cols': 2 }}>
            <button type="button" className={mode === 'SEGMENT' ? 'active' : ''} onClick={() => setMode('SEGMENT')}>
              Player Segment
            </button>
            <button type="button" className={mode === 'UPLOAD' ? 'active' : ''} onClick={() => setMode('UPLOAD')}>
              Upload IDs
            </button>
          </div>
        </div>

        {mode === 'SEGMENT' && (
          <div className="field-group">
            <label>Choose a segment</label>
            <div className="mb-seg-grid">
              {MANUAL_SEGMENTS.map(s => (
                <button
                  key={s.id}
                  type="button"
                  className={'mb-seg-card' + (s.id === segmentId ? ' active' : '')}
                  onClick={() => setSegmentId(s.id)}
                >
                  <div className="top">
                    <span className="dot"/>
                    <span className="lbl">{s.label}</span>
                    <span className="cnt">{s.count.toLocaleString('en-IN')}</span>
                  </div>
                  <div className="hint">{s.hint}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {mode === 'UPLOAD' && (
          <>
            <div className="field-group">
              <label>Upload CSV / paste player IDs</label>
              <div className="mb-upload">
                <label className="mb-file">
                  <Icon name="upload" size={13}/>
                  <span>Upload CSV / TXT</span>
                  <input type="file" accept=".csv,.txt,text/plain,text/csv" onChange={handleFile} hidden/>
                </label>
                <span className="mb-or">or paste below</span>
              </div>
              <textarea
                value={idsText}
                onChange={(e) => setIdsText(e.target.value)}
                placeholder={"PLAYER_123\nPLAYER_456,1000\nPLAYER_789,500\n# Lines starting with # are ignored"}
                style={{ fontFamily: 'var(--mono)', fontSize: 12, minHeight: 130 }}
              />
              <div className="helper">
                One player ID per line. Optional second column = bonus for that player (overrides default).
              </div>
            </div>
          </>
        )}

        <div className="field-group">
          <Toggle on={autoApply} onChange={setAutoApply} label={autoApply ? 'Auto-credit on issue' : 'Player must redeem code'}/>
        </div>

        <div className="field-group">
          <label>Note <span style={{ color: 'var(--g400)', fontWeight: 400 }}>· internal</span></label>
          <textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="Why is this bonus being issued? (audit trail)" style={{ minHeight: 60 }}/>
        </div>

        {/* Summary preview */}
        <div className="mb-summary">
          <div className="mb-summary-row">
            <span className="k">Reach</span>
            <span className="v">{reach.toLocaleString('en-IN')} <span className="ct">players</span></span>
          </div>
          <div className="mb-summary-row">
            <span className="k">Per player</span>
            <span className="v">{perPlayer ? formatINRCompact(perPlayer) : '—'}</span>
          </div>
          <div className="mb-summary-row total">
            <span className="k">Total cost</span>
            <span className="v">{totalCost ? formatINRCompact(totalCost) : '—'}</span>
          </div>
          <div className="mb-summary-row">
            <span className="k">Promo code</span>
            <span className="v mono">{code || '—'}</span>
          </div>
        </div>
      </div>
      <DrawerFooter submitting={submitting} onCancel={onCancel} label={`Issue Bonus${reach ? ' to ' + reach.toLocaleString('en-IN') : ''}`}/>
    </form>
  );
}

 * ============================================================ */
function BudgetForm({ state, submitting, onCancel, onSubmit }) {
  const scope = state.scope || 'head';
  const source =
    scope === 'subhead'   ? MOCK_SUBHEADS[state.id] :
    scope === 'configure' ? MOCK_CONFIGURES[state.id] :
                            MOCK_HEADS[state.id];
  // Configures keep their pot in CONFIGURE_BUDGETS — fall back to inheritance display
  const ownBudget =
    scope === 'configure' ? (CONFIGURE_BUDGETS[state.id] || []) :
    (source?.budget || []);
  const inherits = scope === 'configure' && !CONFIGURE_BUDGETS[state.id];
  const parentLabel =
    scope === 'subhead'   ? source?.parent_head_name :
    scope === 'configure' ? MOCK_SUBHEADS[source?.subhead_id]?.name :
                            null;

  const scopeLabel = { head: 'Head', subhead: 'Subhead', configure: 'Configure' }[scope];
  const scopeIcon  = { head: 'folder', subhead: 'folder-tree', configure: 'settings-2' }[scope];

  const [daily, setDaily]     = useState(ownBudget.find(b => b.period_type === 'DAILY')?.limit || '');
  const [weekly, setWeekly]   = useState(ownBudget.find(b => b.period_type === 'WEEKLY')?.limit || '');
  const [monthly, setMonthly] = useState(ownBudget.find(b => b.period_type === 'MONTHLY')?.limit || '');

  const handle = (e) => { e.preventDefault(); onSubmit({ type: 'EDIT_BUDGET', scope, id: state.id, daily, weekly, monthly }); };

  return (
    <form onSubmit={handle} style={{ display: 'contents' }}>
      <div className="drawer-body">
        {source && (
          <div className="field-group">
            <label>{scopeLabel}</label>
            <span className="parent-chip"><Icon name={scopeIcon} size={11}/> {source.name}</span>
            {parentLabel && (
              <div className="helper" style={{ marginTop: 4 }}>
                under <strong style={{ color: 'var(--g700)' }}>{parentLabel}</strong>
              </div>
            )}
          </div>
        )}
        {inherits && (
          <div style={{
            padding: '10px 12px', borderRadius: 'var(--r)',
            background: 'var(--bp)', border: '1px solid var(--bm)',
            fontSize: 12, color: 'var(--blue)', marginBottom: 14,
            display: 'flex', alignItems: 'center', gap: 8,
          }}>
            <Icon name="info" size={13}/>
            This configure currently inherits its budget from its subhead. Set any limit below to give it its own cap.
          </div>
        )}
        <div className="field-group">
          <label>Daily limit (₹)</label>
          <input value={daily} onChange={(e) => setDaily(e.target.value)} placeholder="leave empty for ∞"/>
        </div>
        <div className="field-group">
          <label>Weekly limit (₹)</label>
          <input value={weekly} onChange={(e) => setWeekly(e.target.value)} placeholder="leave empty for ∞"/>
        </div>
        <div className="field-group">
          <label>Monthly limit (₹)</label>
          <input value={monthly} onChange={(e) => setMonthly(e.target.value)} placeholder="leave empty for ∞"/>
        </div>
        <div className="helper" style={{ marginTop: 8 }}>
          When a period limit is hit, {scope === 'head' ? 'configures' : scope === 'subhead' ? 'this subhead\u2019s configures' : 'this configure'} pause until reset.
        </div>
      </div>
      <DrawerFooter submitting={submitting} onCancel={onCancel} label="Save Budget"/>
    </form>
  );
}
