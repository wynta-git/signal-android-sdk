[project]
name = "bonus-webhook-receiver"
version = "0.1.0"
description = "Test receiver for bonus lifecycle webhooks (BONUS_GRANTED/RELEASED/EXPIRED/FORFEITED)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
