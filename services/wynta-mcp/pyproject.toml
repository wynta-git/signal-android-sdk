[project]
name = "wynta-mcp"
version = "0.1.0"
description = "MCP server for the Wynta Mobile Dashboard API"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
wynta-mcp = "wynta_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wynta_mcp"]
